# Cloudflare Worker that triggers the forecast pipelines on time.
#
# WHY THIS EXISTS: GitHub's `schedule` (cron) events are heavily throttled and
# were firing our forecasts ~5h late in the 00z/12z windows — sometimes dropped
# entirely. Cloudflare cron triggers fire promptly, and a `repository_dispatch`
# API call (unlike `schedule`) starts the GitHub workflow within seconds.
#
# THE SCHEDULE BELOW IS THE SINGLE SOURCE OF TRUTH for forecast timing. It is
# version-controlled here and deployed to Cloudflare by CI on every push to main
# (.github/workflows/deploy-trigger.yml) — never hand-edited in the dashboard.

name = "pnw-soaring-trigger"
main = "src/worker.js"
compatibility_date = "2026-01-01"

# This Worker is cron-only — it needs no public HTTP route, so we don't publish
# to workers.dev (which would require registering an account subdomain). The
# scheduled handler fires regardless. To use the GET / health endpoint, register
# a workers.dev subdomain in the Cloudflare dashboard and set this to true.
workers_dev = false

# Forecast cadence. Crons are UTC. HRRR and NAM fire on SEPARATE schedules and
# event types so each catches its own cycle promptly — NAM GRIB publishes ~40min
# after HRRR, so a shared HRRR-timed dispatch made NAM (auto-cycle) grab the
# stale previous cycle. Each cron maps to {event_type, cycle} in worker.js.
# (Cloudflare free tier caps a Worker at 5 cron triggers.)
[triggers]
crons = [
  # HRRR — a little after HRRR GRIB publishes (~cycle+1h25). 3x/day (short reach).
  "15 1 * * *",   # 00z HRRR (~01:25z) — night-before / tomorrow
  "15 7 * * *",   # 06z HRRR (~07:25z) — pre-dawn refresh of today
  "0 13 * * *",   # 12z HRRR (~13:10z) — freshest of today
  # NAM — later, after NAM GRIB publishes (~cycle+2h). 2x/day (84h reach covers more).
  "5 2 * * *",    # 00z NAM (~02:05z) — overnight multi-day outlook
  "0 14 * * *",   # 12z NAM (~13:54z) — freshest midday
]

# Non-secret config (the GitHub token is injected as an encrypted Worker secret
# by the deploy workflow, not stored here). Event types are per-model — see the
# CRON_MAP in worker.js; forecast-hrrr.yml listens for run-hrrr, forecast-nam.yml
# for run-nam.
[vars]
GH_OWNER = "nw-paragliding"
GH_REPO = "pnw-soaring"
