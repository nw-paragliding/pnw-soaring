name: Forecast (RRFS)

# RRFS (Rapid Refresh Forecast System, 3 km) drives the SAME WRF chain as the
# NAM product (4 km -> 1.33 km, DrJack physics) for every WA region tile: the
# job's domain config is domains/<region>.yaml with `model: rrfs` swapped in at
# run time (scripts/derive-domain.sh). It is a third model alongside NAM and
# HRRR until NCEP retires NAM on 2026-11-03 12Z, after which it replaces NAM.

on:
  # Fired by the Cloudflare trigger Worker (cloudflare-trigger/): the two NAM
  # crons dispatch both run-nam and run-rrfs (no spare cron on the free tier),
  # so this starts at the same instant as the NAM run. repository_dispatch
  # starts within seconds — unlike GitHub's throttled `schedule` events. One
  # dispatch starts every region and day.
  repository_dispatch:
    types: [run-rrfs]
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Base date YYYY-MM-DD for the 2-day window (blank = today UTC)'
        required: false
      regions:
        description: 'Region tiles to run, JSON list (blank = all seven)'
        required: false

env:
  IMAGE: ghcr.io/nw-paragliding/windgram:latest   # needs >= 0.6.0 (adds the rrfs model)
  # NOMADS root for RRFS GRIB. NCEP serves the parallel-production feed under
  # .../com/rrfs/v1.0 until the 2026-11-03 12Z switch, when it moves to
  # .../com/rrfs/prod. Set the repository variable RASP_RRFS_ROOT (Settings →
  # Secrets and variables → Actions → Variables) to switch without a code change;
  # the wait gate polls it and the image honours the same env var (passed into
  # `docker run` by .github/actions/run-forecast).
  RASP_RRFS_ROOT: ${{ vars.RASP_RRFS_ROOT || 'https://nomads.ncep.noaa.gov/pub/data/nccf/com/rrfs/v1.0' }}

# Seven WA region tiles x a two-day forecast = 14 arm jobs (day 0 = today UTC,
# day 1 = tomorrow UTC). Both the evening (00z) and morning (12z) dispatches fire
# on the same UTC date, so {today, tomorrow} covers "tomorrow+next-day" (evening)
# and "today+tomorrow" (morning) alike. --target-date auto-selects the freshest
# covering cycle (same mode as NAM — --target-cycle would force an fhr-0 start
# and a ~50 h WRF run on the day-1 leg). The days are two jobs rather than one
# matrix axis only so that each waits on its own gate: day 0 starts when f27 is
# out (~20 min after the dispatch), day 1 when f51 is (~45 min).
jobs:
  wait-day0:
    # RRFS readiness gate for the day-0 legs (f027): one small x86 runner polls
    # NOMADS so the arm matrix doesn't hold 7 runners idle for up to 75 min
    # against the 20-job cap. Times out and proceeds (see scripts/wait-rrfs.sh).
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait for RRFS GRIB on NOMADS (day 0, f027)
        id: ready
        run: scripts/wait-rrfs.sh 0

  forecast-day0:
    # Day 0 legs for every region; start once wait-day0 has seen the files.
    needs: wait-day0
    strategy:
      fail-fast: false
      matrix:
        region: ${{ fromJson(inputs.regions || '["issaquah","wenatchee","skykomish","chelan","baker","methow","waterville"]') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Soaring date (day 0)
        id: date
        run: |
          # Per-day target date: base (manual input, else today UTC) + matrix offset.
          BASE="${{ inputs.target_date }}${{ github.event.client_payload.target_date }}"
          [ -z "$BASE" ] && BASE=$(date -u +%F)
          TARGET_DATE=$(date -u -d "$BASE +0 days" +%F)
          echo "Day 0 → soaring date $TARGET_DATE (auto-cycle)"
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"

      - name: Run forecast
        id: run
        uses: ./.github/actions/run-forecast
        with:
          model: rrfs
          region: ${{ matrix.region }}
          target_date: ${{ steps.date.outputs.target_date }}
          image: ${{ env.IMAGE }}

      - name: Upload windgrams
        uses: actions/upload-artifact@v4
        with:
          name: rrfs-${{ matrix.region }}-day0
          path: output/*.png
          retention-days: 7

      # Only the home tile writes the v2 soaring cube: R2 keeps its
      # <model>/<date>/soaring.zarr layout and site/v2 shows the issaquah tile.
      # Publishing is main-only: a run from any other ref renders + uploads
      # artifacts but never touches gh-pages or R2.
      - name: Upload soaring cube to R2 (v2)
        if: always() && matrix.region == 'issaquah' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/upload-cube
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        with:
          model: rrfs
          day: 0

  wait-day1:
    # RRFS readiness gate for the day-1 legs (f051): one small x86 runner polls
    # NOMADS so the arm matrix doesn't hold 7 runners idle for up to 75 min
    # against the 20-job cap. Times out and proceeds (see scripts/wait-rrfs.sh).
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait for RRFS GRIB on NOMADS (day 1, f051)
        id: ready
        run: scripts/wait-rrfs.sh 1

  forecast-day1:
    # Day 1 legs for every region; start once wait-day1 has seen the files.
    needs: wait-day1
    strategy:
      fail-fast: false
      matrix:
        region: ${{ fromJson(inputs.regions || '["issaquah","wenatchee","skykomish","chelan","baker","methow","waterville"]') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Soaring date (day 1)
        id: date
        run: |
          # Per-day target date: base (manual input, else today UTC) + matrix offset.
          BASE="${{ inputs.target_date }}${{ github.event.client_payload.target_date }}"
          [ -z "$BASE" ] && BASE=$(date -u +%F)
          TARGET_DATE=$(date -u -d "$BASE +1 days" +%F)
          echo "Day 1 → soaring date $TARGET_DATE (auto-cycle)"
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"

      - name: Run forecast
        id: run
        uses: ./.github/actions/run-forecast
        with:
          model: rrfs
          region: ${{ matrix.region }}
          target_date: ${{ steps.date.outputs.target_date }}
          image: ${{ env.IMAGE }}

      - name: Upload windgrams
        uses: actions/upload-artifact@v4
        with:
          name: rrfs-${{ matrix.region }}-day1
          path: output/*.png
          retention-days: 7

      # Only the home tile writes the v2 soaring cube: R2 keeps its
      # <model>/<date>/soaring.zarr layout and site/v2 shows the issaquah tile.
      # Publishing is main-only: a run from any other ref renders + uploads
      # artifacts but never touches gh-pages or R2.
      - name: Upload soaring cube to R2 (v2)
        if: always() && matrix.region == 'issaquah' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/upload-cube
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        with:
          model: rrfs
          day: 1

  publish:
    # One gh-pages commit for every region and day (instead of one per job).
    # Runs even when some legs failed, so one bad region never blocks the rest.
    needs: [forecast-day0, forecast-day1]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rrfs-*
          path: windgrams
      - name: Deploy to Pages
        uses: ./.github/actions/deploy-forecast
        with:
          model: rrfs
          artifacts_dir: windgrams
          latest_day: "0"
