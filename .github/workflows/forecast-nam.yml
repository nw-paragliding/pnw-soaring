name: Forecast (NAM)

# RETIRED. NCEP removed NAM from NOMADS on 2026-11-03 12Z (SCN 26-47); RRFS
# (forecast-rrfs.yml, same WRF chain) replaced it and the Cloudflare trigger
# (cloudflare-trigger/) no longer dispatches run-nam. The workflow is kept for
# manual runs only (Actions tab -> Run workflow) and fails as soon as the NAM
# GRIB download finds nothing; delete it with the rest of the NAM cleanup.

on:
  # Manual only. The repository_dispatch trigger (run-nam) was removed with the
  # NAM retirement so that nothing can schedule this run by accident.
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Base date YYYY-MM-DD for the 2-day window (blank = today UTC)'
        required: false
      regions:
        description: 'Region tiles to run, JSON list (blank = all seven)'
        required: false

env:
  # v2 soaring-cube upload to R2 is OFF (R2 cost): the pipeline still writes
  # output/soaring.zarr, it just isn't uploaded. 'true' re-enables it for the
  # issaquah tile; r2-prune.yml keeps ageing out the existing objects.
  UPLOAD_CUBES: 'false'
  IMAGE: ghcr.io/nw-paragliding/windgram:latest

jobs:
  forecast:
    # Seven WA region tiles (domains/<region>.yaml, README "Regions") x a
    # two-day forecast: one windgram set per tile per day, each an independent
    # parallel run (day 0 = today UTC, day 1 = tomorrow UTC) = 14 jobs. Both the
    # evening (00z) and morning (12z) dispatches fire on the same UTC date, so
    # {today, tomorrow} covers "tomorrow+next-day" (evening) and "today+tomorrow"
    # (morning) alike. --target-date auto-selects the freshest covering cycle.
    strategy:
      fail-fast: false
      matrix:
        region: ${{ fromJson(inputs.regions || '["issaquah","wenatchee","skykomish","chelan","baker","methow","waterville"]') }}
        day: [0, 1]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Soaring date (day ${{ matrix.day }})
        id: date
        run: |
          # Per-day target date: base (manual input, else today UTC) + matrix offset.
          BASE="${{ inputs.target_date }}${{ github.event.client_payload.target_date }}"
          [ -z "$BASE" ] && BASE=$(date -u +%F)
          TARGET_DATE=$(date -u -d "$BASE +${{ matrix.day }} days" +%F)
          echo "Day ${{ matrix.day }} → soaring date $TARGET_DATE (auto-cycle)"
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"

      - name: Run forecast
        id: run
        uses: ./.github/actions/run-forecast
        with:
          model: nam
          region: ${{ matrix.region }}
          target_date: ${{ steps.date.outputs.target_date }}
          image: ${{ env.IMAGE }}

      - name: Upload windgrams
        uses: actions/upload-artifact@v4
        with:
          name: nam-${{ matrix.region }}-day${{ matrix.day }}
          path: output/*.png
          retention-days: 7

      # Disabled while UPLOAD_CUBES is 'false'. When on, only the home tile writes the v2 soaring cube: R2 keeps its
      # <model>/<date>/soaring.zarr layout and site/v2 shows the issaquah tile.
      # Publishing is main-only: a run from any other ref renders + uploads
      # artifacts but never touches gh-pages or R2.
      - name: Upload soaring cube to R2 (v2)
        if: always() && env.UPLOAD_CUBES == 'true' && matrix.region == 'issaquah' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/upload-cube
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        with:
          model: nam
          day: ${{ matrix.day }}

  publish:
    # One gh-pages commit for the whole matrix (instead of one per job). Runs
    # even when some legs failed, so one bad region never blocks the rest; legs
    # without an artifact are simply not published (the site keeps their
    # previous windgrams / shows "no forecast yet").
    needs: forecast
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: nam-*
          path: windgrams
      - name: Deploy to Pages
        uses: ./.github/actions/deploy-forecast
        with:
          model: nam
          artifacts_dir: windgrams
          latest_day: "0"
