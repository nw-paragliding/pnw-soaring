name: Forecast (NAM)

on:
  schedule:
    # Crons fire ~1h after cycle init. Pipeline polls NOMADS and runs as soon
    # as all needed forecast hours are available.
    - cron: '0 1 * * *'       # Target 00z NAM cycle (evening planning)
    - cron: '30 12 * * *'     # Target 12z NAM cycle (morning refresh)
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target date YYYY-MM-DD (blank = auto)'
        required: false

env:
  IMAGE: ghcr.io/nw-paragliding/windgram:latest

jobs:
  forecast:
    runs-on: ubuntu-24.04-arm
    # Budget: up to 4h sleep (from --not-before compensation) + ~1.5h runtime
    timeout-minutes: 360
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Restore geo_em cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: geo_em/
          key: geo-em-cascades-nam-v2

      - name: Download geo_em from release (cache miss fallback)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p geo_em
          gh release download geo-em-v1 --pattern 'geo_em_nam-v2.tar.gz' --dir .
          tar xzf geo_em_nam-v2.tar.gz -C geo_em
          rm geo_em_nam-v2.tar.gz
          echo "Downloaded geo_em from release:"
          ls -lh geo_em/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull $IMAGE

      - name: Run forecast
        run: |
          mkdir -p output
          TARGET_DATE="${{ inputs.target_date }}"
          TARGET_FLAG=""
          if [ -n "$TARGET_DATE" ]; then
            TARGET_FLAG="--target-date $TARGET_DATE"
          fi

          # Pass --target-cycle based on which cron fired (no-op for manual dispatch).
          CYCLE_FLAG=""
          case "${{ github.event.schedule }}" in
            '0 1 * * *')    CYCLE_FLAG="--target-cycle 0" ;;   # evening: 00z cycle
            '30 12 * * *')  CYCLE_FLAG="--target-cycle 12" ;;  # morning: 12z cycle
          esac

          docker run --rm \
            -v ${{ github.workspace }}/geo_em:/mnt/geo_em:ro \
            -v ${{ github.workspace }}/output:/mnt/output:rw \
            -v ${{ github.workspace }}/domains/cascades.yaml:/opt/rasp/domain.yaml:ro \
            -v ${{ github.workspace }}/sites/issaquah-sites.csv:/opt/rasp/sites.csv:ro \
            --entrypoint bash \
            $IMAGE -c "
              cp /mnt/geo_em/geo_em.d0*.nc /opt/rasp/wps/ 2>/dev/null || true
              python3 -m rasp.pipeline domain.yaml \
                --sites sites.csv \
                --output-dir /mnt/output \
                --num-procs 4 \
                $CYCLE_FLAG \
                $TARGET_FLAG
            "

      - name: Save geo_em cache
        if: hashFiles('geo_em/geo_em.d01.nc') != ''
        uses: actions/cache/save@v4
        with:
          path: geo_em/
          key: geo-em-cascades-nam-v2

      - name: Upload windgrams
        uses: actions/upload-artifact@v4
        with:
          name: nam-windgrams
          path: output/*.png
          retention-days: 7

      - name: Deploy to Pages
        run: |
          # Determine date from output filenames
          DATE=$(ls output/*.png | head -1 | xargs basename | cut -d_ -f1)
          MODEL=nam

          # Clone gh-pages
          git fetch origin gh-pages || true
          git worktree add pages origin/gh-pages 2>/dev/null || {
            git worktree add pages --orphan gh-pages-new
            cd pages && git checkout --orphan gh-pages && cd ..
          }

          # Stage forecast files
          mkdir -p "pages/forecasts/${DATE}/${MODEL}"
          for f in output/*.png; do
            NEWNAME=$(basename "$f" | sed 's/^[0-9-]*_//')
            cp "$f" "pages/forecasts/${DATE}/${MODEL}/${NEWNAME}"
          done
          echo "{\"model\":\"${MODEL}\",\"date\":\"${DATE}\",\"generated\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" \
            > "pages/forecasts/${DATE}/${MODEL}/metadata.json"

          # Update latest
          rm -rf "pages/forecasts/latest/${MODEL}"
          mkdir -p "pages/forecasts/latest/${MODEL}"
          cp "pages/forecasts/${DATE}/${MODEL}/"* "pages/forecasts/latest/${MODEL}/"

          # Generate sites.json
          python3 site/generate-sites-json.py sites/issaquah-sites.csv > pages/sites.json

          # Copy frontend if not present
          cp -n site/index.html pages/index.html 2>/dev/null || true

          # Cleanup old forecasts (>7 days)
          CUTOFF=$(date -d '7 days ago' +%Y-%m-%d 2>/dev/null || date -v-7d +%Y-%m-%d 2>/dev/null || echo "")
          if [ -n "$CUTOFF" ]; then
            for dir in pages/forecasts/20??-??-??; do
              [ -d "$dir" ] || continue
              DIR_DATE=$(basename "$dir")
              if [[ "$DIR_DATE" < "$CUTOFF" ]]; then
                rm -rf "$dir"
              fi
            done
          fi

          # Commit and push
          cd pages
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update ${MODEL} forecast for ${DATE}"
          git push origin HEAD:gh-pages
