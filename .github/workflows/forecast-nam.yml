name: Forecast (NAM)

on:
  schedule:
    - cron: '0 5 * * *'     # Evening: next-day planning (10pm PDT, uses 00z NAM)
    - cron: '30 16 * * *'   # Morning: day-of update (9:30am PDT, uses 12z NAM)
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target date YYYY-MM-DD (blank = auto)'
        required: false

env:
  IMAGE: ghcr.io/nw-paragliding/windgram:latest

jobs:
  forecast:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Restore geo_em cache
        uses: actions/cache/restore@v4
        with:
          path: geo_em/
          key: geo-em-cascades-nam-v1

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull $IMAGE

      - name: Run forecast
        run: |
          mkdir -p output
          TARGET_DATE="${{ inputs.target_date }}"
          TARGET_FLAG=""
          if [ -n "$TARGET_DATE" ]; then
            TARGET_FLAG="--target-date $TARGET_DATE"
          fi

          docker run --rm \
            -v ${{ github.workspace }}/geo_em:/mnt/geo_em:ro \
            -v ${{ github.workspace }}/output:/mnt/output:rw \
            -v ${{ github.workspace }}/domains/cascades.yaml:/opt/rasp/domain.yaml:ro \
            -v ${{ github.workspace }}/sites/issaquah.csv:/opt/rasp/sites.csv:ro \
            --entrypoint bash \
            $IMAGE -c "
              cp /mnt/geo_em/geo_em.d0*.nc /opt/rasp/wps/ 2>/dev/null || true
              python3 -m rasp.pipeline domain.yaml \
                --sites sites.csv \
                --output-dir /mnt/output \
                --num-procs 4 \
                $TARGET_FLAG
            "

      - name: Save geo_em cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: geo_em/
          key: geo-em-cascades-nam-v1

      - name: Upload windgrams
        uses: actions/upload-artifact@v4
        with:
          name: nam-windgrams
          path: output/*.png
          retention-days: 7

      - name: Deploy to Pages
        run: |
          # Determine date from output filenames
          DATE=$(ls output/*.png | head -1 | xargs basename | cut -d_ -f1)
          MODEL=nam

          # Clone gh-pages
          git fetch origin gh-pages || true
          git worktree add pages origin/gh-pages 2>/dev/null || {
            git worktree add pages --orphan gh-pages-new
            cd pages && git checkout --orphan gh-pages && cd ..
          }

          # Stage forecast files
          mkdir -p "pages/forecasts/${DATE}/${MODEL}"
          for f in output/*.png; do
            NEWNAME=$(basename "$f" | sed 's/^[0-9-]*_//')
            cp "$f" "pages/forecasts/${DATE}/${MODEL}/${NEWNAME}"
          done
          echo "{\"model\":\"${MODEL}\",\"date\":\"${DATE}\",\"generated\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" \
            > "pages/forecasts/${DATE}/${MODEL}/metadata.json"

          # Update latest
          rm -rf "pages/forecasts/latest/${MODEL}"
          mkdir -p "pages/forecasts/latest/${MODEL}"
          cp "pages/forecasts/${DATE}/${MODEL}/"* "pages/forecasts/latest/${MODEL}/"

          # Generate sites.json
          python3 site/generate-sites-json.py sites/issaquah.csv > pages/sites.json

          # Copy frontend if not present
          cp -n site/index.html pages/index.html 2>/dev/null || true

          # Cleanup old forecasts (>7 days)
          CUTOFF=$(date -d '7 days ago' +%Y-%m-%d 2>/dev/null || date -v-7d +%Y-%m-%d 2>/dev/null || echo "")
          if [ -n "$CUTOFF" ]; then
            for dir in pages/forecasts/20??-??-??; do
              [ -d "$dir" ] || continue
              DIR_DATE=$(basename "$dir")
              if [[ "$DIR_DATE" < "$CUTOFF" ]]; then
                rm -rf "$dir"
              fi
            done
          fi

          # Commit and push
          cd pages
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update ${MODEL} forecast for ${DATE}"
          git push origin HEAD:gh-pages
