name: Forecast (NAM)

on:
  schedule:
    # Crons fire ~1h after cycle init. Pipeline polls NOMADS and runs as soon
    # as all needed forecast hours are available.
    - cron: '0 1 * * *'       # Target 00z NAM cycle (evening planning)
    - cron: '30 12 * * *'     # Target 12z NAM cycle (morning refresh)
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target date YYYY-MM-DD (blank = auto)'
        required: false
      target_cycle:
        description: 'Force a specific cycle (e.g. 0 or 12). Blank = latest available.'
        required: false

env:
  IMAGE: ghcr.io/nw-paragliding/windgram:latest

jobs:
  forecast:
    runs-on: ubuntu-24.04-arm
    # Budget: up to 4h sleep (from --not-before compensation) + ~1.5h runtime
    timeout-minutes: 360
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Restore geo_em cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: geo_em/
          key: geo-em-cascades-nam-v2

      - name: Download geo_em from release (cache miss fallback)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p geo_em
          gh release download geo-em-v1 --pattern 'geo_em_nam-v2.tar.gz' --dir .
          tar xzf geo_em_nam-v2.tar.gz -C geo_em
          rm geo_em_nam-v2.tar.gz
          echo "Downloaded geo_em from release:"
          ls -lh geo_em/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull $IMAGE

      - name: Run forecast
        run: |
          mkdir -p output
          TARGET_DATE="${{ inputs.target_date }}"
          TARGET_FLAG=""
          if [ -n "$TARGET_DATE" ]; then
            TARGET_FLAG="--target-date $TARGET_DATE"
          fi

          # Pass --target-cycle from workflow_dispatch input or based on which cron fired.
          CYCLE_FLAG=""
          if [ -n "${{ inputs.target_cycle }}" ]; then
            CYCLE_FLAG="--target-cycle ${{ inputs.target_cycle }}"
          else
            case "${{ github.event.schedule }}" in
              '0 1 * * *')    CYCLE_FLAG="--target-cycle 0" ;;   # evening: 00z cycle
              '30 12 * * *')  CYCLE_FLAG="--target-cycle 12" ;;  # morning: 12z cycle
            esac
          fi

          docker run --rm \
            -v ${{ github.workspace }}/geo_em:/mnt/geo_em:ro \
            -v ${{ github.workspace }}/output:/mnt/output:rw \
            -v ${{ github.workspace }}/domains/cascades.yaml:/opt/rasp/domain.yaml:ro \
            -v ${{ github.workspace }}/sites/issaquah-sites.csv:/opt/rasp/sites.csv:ro \
            --entrypoint bash \
            $IMAGE -c "
              cp /mnt/geo_em/geo_em.d0*.nc /opt/rasp/wps/ 2>/dev/null || true
              python3 -m rasp.pipeline domain.yaml \
                --sites sites.csv \
                --output-dir /mnt/output \
                --num-procs 4 \
                $CYCLE_FLAG \
                $TARGET_FLAG
            "

      - name: Save geo_em cache
        if: hashFiles('geo_em/geo_em.d01.nc') != ''
        uses: actions/cache/save@v4
        with:
          path: geo_em/
          key: geo-em-cascades-nam-v2

      - name: Upload windgrams
        uses: actions/upload-artifact@v4
        with:
          name: nam-windgrams
          path: output/*.png
          retention-days: 7

      - name: Deploy to Pages
        uses: ./.github/actions/deploy-forecast
        with:
          model: nam
