name: Test HRRR 1km (experimental)

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target date YYYY-MM-DD (blank = auto)'
        required: false

env:
  IMAGE: ghcr.io/nw-paragliding/windgram:latest

jobs:
  forecast:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Restore geo_em cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: geo_em/
          key: geo-em-cascades-hrrr-1km-v2

      - name: Download geo_em from release (cache miss fallback)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p geo_em
          gh release download geo-em-v1 --pattern 'geo_em_hrrr-1km.tar.gz' --dir .
          tar xzf geo_em_hrrr-1km.tar.gz -C geo_em
          rm geo_em_hrrr-1km.tar.gz
          echo "Downloaded geo_em from release:"
          ls -lh geo_em/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull $IMAGE

      - name: Run forecast
        run: |
          mkdir -p output wrfout-debug
          TARGET_DATE="${{ inputs.target_date }}"
          TARGET_FLAG=""
          if [ -n "$TARGET_DATE" ]; then
            TARGET_FLAG="--target-date $TARGET_DATE"
          fi

          docker run --rm \
            -v ${{ github.workspace }}/geo_em:/mnt/geo_em:ro \
            -v ${{ github.workspace }}/output:/mnt/output:rw \
            -v ${{ github.workspace }}/wrfout-debug:/mnt/wrfout:rw \
            -v ${{ github.workspace }}/domains/cascades-hrrr-1km.yaml:/opt/rasp/domain.yaml:ro \
            -v ${{ github.workspace }}/sites/issaquah-sites.csv:/opt/rasp/sites.csv:ro \
            --entrypoint bash \
            $IMAGE -c "cp /mnt/geo_em/geo_em.d0*.nc /opt/rasp/wps/ 2>/dev/null || true && python3 -m rasp.pipeline domain.yaml --sites sites.csv --output-dir /mnt/output --num-procs 4 --max-hours 2 $TARGET_FLAG; EC=\$?; cp /opt/rasp/runs/cascades-hrrr-1km/wrfout_d0* /mnt/wrfout/ 2>/dev/null || true; cp /opt/rasp/runs/cascades-hrrr-1km/rsl.* /mnt/wrfout/ 2>/dev/null || true; cp /opt/rasp/runs/cascades-hrrr-1km/namelist.* /mnt/wrfout/ 2>/dev/null || true; exit \$EC"

      - name: Diagnose wrfout
        if: always()
        run: |
          pip3 install netCDF4 numpy
          python3 << 'PYEOF'
          import netCDF4, numpy as np, glob
          # Tiger location
          tlat, tlon = 47.503, -121.975
          for f in sorted(glob.glob("wrfout-debug/wrfout_d0*")):
              nc = netCDF4.Dataset(f)
              nt = nc.dimensions["Time"].size
              print(f"\n=== {f}: {nt} times ===")
              # Find Tiger grid point
              if "XLAT" in nc.variables:
                  xlat = nc.variables["XLAT"][0]
                  xlon = nc.variables["XLONG"][0]
                  dist = (xlat - tlat)**2 + (xlon - tlon)**2
                  iy, ix = np.unravel_index(dist.argmin(), dist.shape)
                  print(f"  Tiger grid pt: ({iy},{ix}) lat={float(xlat[iy,ix]):.3f} lon={float(xlon[iy,ix]):.3f}")
                  for v in ["HFX","LH","PBLH","T2","U10","V10"]:
                      if v not in nc.variables: continue
                      d = nc.variables[v]
                      print(f"  {v} at Tiger:")
                      for t in range(nt):
                          val = float(d[t, iy, ix])
                          print(f"    t={t}: {val:.3f}")
              nc.close()
          PYEOF

      - name: Upload WRF rsl logs + namelists
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrf-debug
          path: |
            wrfout-debug/rsl.*
            wrfout-debug/namelist.*
          retention-days: 7
          if-no-files-found: ignore

      - name: Save geo_em cache
        if: hashFiles('geo_em/geo_em.d01.nc') != ''
        uses: actions/cache/save@v4
        with:
          path: geo_em/
          key: geo-em-cascades-hrrr-1km-v2

      - name: Upload windgrams (artifact only, no deploy)
        uses: actions/upload-artifact@v4
        with:
          name: hrrr-1km-windgrams
          path: output/*.png
          retention-days: 7
