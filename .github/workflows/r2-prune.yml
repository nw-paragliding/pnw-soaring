name: Prune old R2 cubes

# The v2 GeoZarr cubes live in R2 at <model>/<YYYY-MM-DD>/soaring.zarr (one per
# model per forecast day) plus a <model>/latest/ pointer. New dated cubes are
# added daily and never removed, so storage grows without bound toward the R2
# free tier (10 GB). The frontend only ever reads `latest` and the today/next
# few dated cubes, so older dated cubes are pure dead weight. This job keeps
# `latest` + the N most-recent dated cubes per model and purges the rest.

on:
  schedule:
    - cron: '30 9 * * *'   # daily ~02:30 PDT, after the overnight forecasts settle
  workflow_dispatch:
    inputs:
      keep:
        description: 'Most-recent dated cubes to keep per model (plus latest)'
        required: false
        default: '4'
      dry_run:
        description: 'List what would be deleted without deleting'
        type: boolean
        required: false
        default: true

jobs:
  prune:
    runs-on: ubuntu-24.04
    steps:
      - name: Prune old dated cubes
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: nw-paragliding-forecasts
          # Scheduled runs prune for real; manual runs default to a dry run.
          KEEP: ${{ inputs.keep || '4' }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "R2 secrets unset/incomplete — nothing to prune."; exit 0
          fi
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1 || sudo apt-get install -y -q rclone
          export RCLONE_S3_PROVIDER=Cloudflare \
                 RCLONE_S3_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
                 RCLONE_S3_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" \
                 RCLONE_S3_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"

          echo "Mode: $([ "$DRY_RUN" = "false" ] && echo DELETE || echo DRY-RUN) · keep $KEEP most-recent dated cubes per model"
          TOTAL_DEL=0
          for MODEL in nam hrrr; do
            echo "── $MODEL ──"
            # Date-named subdirs only (ignore `latest` and any non-date prefixes).
            mapfile -t DATES < <(rclone lsf --dirs-only ":s3:${R2_BUCKET}/${MODEL}/" 2>/dev/null \
              | sed 's:/*$::' | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' | sort)
            n=${#DATES[@]}
            if [ "$n" -eq 0 ]; then echo "  (no dated cubes)"; continue; fi
            echo "  found $n dated cubes: ${DATES[*]}"
            keep_from=$(( n > KEEP ? n - KEEP : 0 ))
            if [ "$keep_from" -eq 0 ]; then echo "  nothing to prune (<= $KEEP)"; continue; fi
            for d in "${DATES[@]:0:$keep_from}"; do
              if [ "$DRY_RUN" = "false" ]; then
                echo "  deleting $MODEL/$d"
                rclone purge ":s3:${R2_BUCKET}/${MODEL}/${d}/soaring.zarr" --s3-no-check-bucket
              else
                echo "  would delete $MODEL/$d"
              fi
              TOTAL_DEL=$((TOTAL_DEL+1))
            done
            echo "  keeping: ${DATES[*]:$keep_from} + latest"
          done
          echo "Done. $([ "$DRY_RUN" = "false" ] && echo "Deleted" || echo "Would delete") $TOTAL_DEL cube(s)."
