name: Forecast (HRRR)

on:
  # Fired by the Cloudflare trigger Worker (cloudflare-trigger/), which carries
  # the target cycle in client_payload.cycle. repository_dispatch starts within
  # seconds — unlike GitHub's throttled `schedule` events, which were running
  # these forecasts ~5h late. The schedule lives in the Worker now.
  repository_dispatch:
    types: [run-forecast]
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Base date YYYY-MM-DD for the 2-day window (blank = today UTC)'
        required: false

env:
  IMAGE: ghcr.io/nw-paragliding/windgram:latest

jobs:
  forecast:
    # Two-day forecast, mirroring the NAM workflow: one windgram set per day,
    # rendered by independent parallel runs (day 0 = today UTC, day 1 = tomorrow
    # UTC). Unlike NAM (84h reach), HRRR only reaches 48h — so the *evening* run
    # cannot reach next-day's full 8am–8pm window (its 8pm is ~51h out). When a
    # day is beyond reach the pipeline falls back to near-term data, which the
    # renderer dates to *today*, not the requested day; the "Guard" step below
    # detects that filename/date mismatch and skips the deploy for that day. So
    # HRRR shows today+tomorrow during the day, and just tomorrow in the evening
    # (NAM, the default model, carries the full two days).
    strategy:
      fail-fast: false
      matrix:
        day: [0, 1]
    runs-on: ubuntu-24.04-arm
    # Budget: up to 4h sleep (from --not-before compensation) + ~15 min runtime
    timeout-minutes: 360
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Check HRRR reach (day ${{ matrix.day }})
        id: reach
        run: |
          # Cheap upfront 48h-horizon test, so an out-of-reach day (next-day in
          # the evening run) exits in seconds instead of running a full WRF sim
          # it would only discard. The post-render Guard below still backstops
          # the publish-lag borderline case.
          BASE="${{ inputs.target_date }}${{ github.event.client_payload.target_date }}"
          [ -z "$BASE" ] && BASE=$(date -u +%F)
          TARGET_DATE=$(date -u -d "$BASE +${{ matrix.day }} days" +%F)
          echo "TARGET_DATE=$TARGET_DATE" >> "$GITHUB_ENV"

          # Soaring window for TARGET_DATE ends 8pm local (PDT=UTC-7) = 03:00z
          # the next day.
          END_DATE=$(date -u -d "$TARGET_DATE +1 day" +%F)
          END_EPOCH=$(date -u -d "$END_DATE 03:00:00Z" +%s)

          # Best case: the newest HRRR cycle already initialized (00/06/12/18z
          # today) minimizes the forecast hour to the window end — if even it
          # can't reach, no cycle can. HRRR tops out at 48h.
          H=$(( 10#$(date -u +%H) ))
          CYC=$(printf '%02d' $(( (H / 6) * 6 )))
          # Pin the run to this *extended* cycle (00/06/12/18z) — only those carry
          # 48h of HRRR GRIB. Auto-cycle would grab the latest *hourly* cycle,
          # which stops at 18h and leaves the afternoon as fill/garbage.
          echo "CYC=$CYC" >> "$GITHUB_ENV"
          CYCLE_EPOCH=$(date -u -d "$(date -u +%F) ${CYC}:00:00Z" +%s)
          FHR_END=$(( (END_EPOCH - CYCLE_EPOCH) / 3600 ))

          echo "Day ${{ matrix.day }} → $TARGET_DATE: window ends ${FHR_END}h past newest cycle (${CYC}z); HRRR reach 48h."
          if [ "$FHR_END" -gt 48 ]; then
            echo "::notice::HRRR can't reach $TARGET_DATE (${FHR_END}h > 48h horizon). Skipping this day — NAM carries it."
            echo "reachable=false" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Free up disk space
        if: steps.reach.outputs.reachable == 'true'
        run: |
          echo "Disk before cleanup:"; df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache \
            /usr/local/share/boost 2>/dev/null || true
          docker system prune -af 2>/dev/null || true
          echo "Disk after cleanup:"; df -h /

      - name: Restore geo_em cache
        id: cache
        if: steps.reach.outputs.reachable == 'true'
        uses: actions/cache/restore@v4
        with:
          path: geo_em/
          # NB: geo_em cache key + release asset keep the "hrrr-1km" name on
          # purpose — the release also holds the old 3km geo_em_hrrr.tar.gz, so
          # renaming this to "hrrr" would fetch the wrong grids. Don't "finish"
          # the rename here without re-bootstrapping + re-uploading the asset.
          key: geo-em-cascades-hrrr-1km-v2

      - name: Download geo_em from release (cache miss fallback)
        if: steps.reach.outputs.reachable == 'true' && steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p geo_em
          gh release download geo-em-v1 --pattern 'geo_em_hrrr-1km.tar.gz' --dir .
          tar xzf geo_em_hrrr-1km.tar.gz -C geo_em
          rm geo_em_hrrr-1km.tar.gz
          echo "Downloaded geo_em from release:"
          ls -lh geo_em/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        if: steps.reach.outputs.reachable == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        if: steps.reach.outputs.reachable == 'true'
        run: docker pull $IMAGE

      - name: Run forecast (day ${{ matrix.day }})
        if: steps.reach.outputs.reachable == 'true'
        run: |
          mkdir -p output
          echo "Day ${{ matrix.day }} → soaring date $TARGET_DATE (cycle ${CYC}z, extended/48h)"

          docker run --rm \
            -v ${{ github.workspace }}/geo_em:/mnt/geo_em:ro \
            -v ${{ github.workspace }}/output:/mnt/output:rw \
            -v ${{ github.workspace }}/domains/cascades-hrrr.yaml:/opt/rasp/domain.yaml:ro \
            -v ${{ github.workspace }}/sites/issaquah-sites.csv:/opt/rasp/sites.csv:ro \
            --entrypoint bash \
            $IMAGE -c "
              cp /mnt/geo_em/geo_em.d0*.nc /opt/rasp/wps/ 2>/dev/null || true
              python3 -m rasp.pipeline domain.yaml \
                --sites sites.csv \
                --output-dir /mnt/output \
                --num-procs 4 \
                --target-date $TARGET_DATE \
                --target-cycle $CYC
            "

      - name: Guard — did HRRR actually reach this day?
        id: guard
        if: steps.reach.outputs.reachable == 'true'
        run: |
          # The renderer dates each windgram to the valid date of its first
          # (8am-local) timestep. If HRRR couldn't reach $TARGET_DATE (next-day
          # in the evening run is ~51h out, past the 48h limit), the pipeline
          # falls back to near-term data dated to *today* — so the rendered date
          # won't match what we asked for. Detect that and skip the deploy/upload
          # for this day rather than publishing today's data under tomorrow.
          count=$(ls output/*.png 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::No windgrams rendered — model produced no usable output (likely bad/NaN model data)."
            exit 1
          fi
          RENDERED=$(ls output/*.png | head -1 | xargs basename | cut -d_ -f1)
          if [ "$RENDERED" != "$TARGET_DATE" ]; then
            echo "::notice::HRRR did not reach $TARGET_DATE (rendered $RENDERED — beyond the 48h horizon). Skipping deploy for this day."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "Rendered $count windgrams for $RENDERED."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save geo_em cache
        if: steps.reach.outputs.reachable == 'true' && matrix.day == 0 && hashFiles('geo_em/geo_em.d01.nc') != ''
        uses: actions/cache/save@v4
        with:
          path: geo_em/
          key: geo-em-cascades-hrrr-1km-v2

      - name: Upload windgrams
        if: steps.guard.outputs.deploy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hrrr-windgrams-day${{ matrix.day }}
          path: output/*.png
          retention-days: 7

      - name: Deploy to Pages
        if: steps.guard.outputs.deploy == 'true'
        uses: ./.github/actions/deploy-forecast
        with:
          model: hrrr
          # Only the nearest reachable day updates /latest; tomorrow lives in its
          # own date dir and the day-picker UI surfaces it.
          update_latest: ${{ matrix.day == 0 }}

      - name: Upload soaring cube to R2 (v2)
        if: steps.guard.outputs.deploy == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: nw-paragliding-forecasts
          MODEL: hrrr
        run: |
          # The pipeline writes output/soaring.zarr on the 24.04 image; older
          # images don't. Both this and missing R2 secrets skip cleanly.
          if [ ! -d output/soaring.zarr ]; then echo "No cube produced — skipping R2 upload."; exit 0; fi
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then echo "R2 secrets unset/incomplete — skipping cube upload."; exit 0; fi
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1 || sudo apt-get install -y -q rclone
          export RCLONE_S3_PROVIDER=Cloudflare \
                 RCLONE_S3_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
                 RCLONE_S3_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" \
                 RCLONE_S3_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          DATE=$(ls output/*.png 2>/dev/null | head -1 | xargs basename | cut -d_ -f1)
          rclone sync output/soaring.zarr ":s3:${R2_BUCKET}/${MODEL}/${DATE}/soaring.zarr" --s3-no-check-bucket
          if [ "${{ matrix.day }}" = "0" ]; then
            rclone sync output/soaring.zarr ":s3:${R2_BUCKET}/${MODEL}/latest/soaring.zarr" --s3-no-check-bucket
          fi
          echo "Uploaded cube → R2 ${R2_BUCKET}/${MODEL}/${DATE}$([ "${{ matrix.day }}" = "0" ] && echo ' (+latest)')"
