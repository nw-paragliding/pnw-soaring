name: Forecast (HRRR)

on:
  # Fired by the Cloudflare trigger Worker (cloudflare-trigger/), which carries
  # the target cycle in client_payload.cycle. repository_dispatch starts within
  # seconds — unlike GitHub's throttled `schedule` events, which were running
  # these forecasts ~5h late. The schedule lives in the Worker now. One dispatch
  # starts every region tile.
  repository_dispatch:
    types: [run-hrrr]
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Soaring date YYYY-MM-DD to render (blank = today UTC)'
        required: false
      regions:
        description: 'Region tiles to run, JSON list (blank = all seven)'
        required: false

env:
  # v2 soaring-cube upload to R2 is OFF (R2 cost): the pipeline still writes
  # output/soaring.zarr, it just isn't uploaded. 'true' re-enables it for the
  # issaquah tile; r2-prune.yml keeps ageing out the existing objects.
  UPLOAD_CUBES: 'false'
  IMAGE: ghcr.io/nw-paragliding/windgram:latest
  # Data root for HRRR GRIB. Default: NOAA's Open Data mirror on AWS
  # (noaa-hrrr-bdp-pds, same hrrr.YYYYMMDD/conus/ layout and .idx files as
  # NOMADS, ~1 min behind it, no throttling). Set the repository variable
  # RASP_HRRR_ROOT to https://nomads.ncep.noaa.gov/pub/data/nccf/com/hrrr/prod
  # to go back to NOMADS. Needs windgram >= 0.7.2 (older images hardcode NOMADS
  # for HRRR and ignore the variable).
  RASP_HRRR_ROOT: ${{ vars.RASP_HRRR_ROOT || 'https://noaa-hrrr-bdp-pds.s3.amazonaws.com' }}

jobs:
  # Seven region tiles x two soaring days (day 0 = base date, default today UTC;
  # day 1 = base + 1) = 14 arm jobs, like NAM/RRFS. HRRR's 00/06/12/18z cycles
  # reach 48 h, so whether a day is reachable depends on the dispatch:
  #
  #   dispatch   newest cycle  day 0 (window end)     day 1 (window end)
  #   01:15z     00z           tomorrow-PDT (27 h)    skipped (51 h > 48 h)
  #   07:15z     06z           today (21 h)           tomorrow (45 h, ~07:45z)
  #   13:00z     12z           today (15 h)           tomorrow (39 h, ~13:40z)
  #
  # Day 0 starts at once. Day 1 waits on one small x86 gate job (wait-day1,
  # scripts/wait-hrrr.sh) for the newest cycle's window-end GRIB, so the wait
  # holds one cheap runner instead of seven arm runners, and the 13:00z day-1
  # legs don't sit on arm runners into the 14:00z NAM+RRFS burst. An unreachable
  # day (past 48 h, or the gate timed out) is skipped: notice, success, no
  # artifact, nothing published. The days are two jobs rather than one matrix
  # axis only so that day 1 alone depends on the gate (same as forecast-rrfs.yml).
  #
  # PR #41 (2026-07) dropped day 1 because its deep forecast hours (fhr 27–45)
  # produced garbage; the cause was a WRF instability (NaN after hours of
  # integration), fixed by `dynamics: {epssm: 0.5}` in every tile (windgram
  # >= 0.7.3), so the second day is back.
  #
  # HRRR feeds the same DrJack 4 km → 1.33 km chain as the NAM/RRFS products:
  # the job's domain config is domains/<region>.yaml with `model: hrrr` and the
  # DrJack-chain override keys of domains/cascades-hrrr.yaml appended at run time
  # (scripts/derive-domain.sh), so it shares the tile's geo_em cache and runs in
  # the NAM product's auto --target-date mode (the pipeline takes the freshest
  # 00/06/12/18z cycle whose files for the whole window are published and starts
  # WRF at the window start, fhr >= 3). "HRRR (beta)" on the site.
  forecast-day0:
    strategy:
      fail-fast: false
      matrix:
        region: ${{ fromJson(inputs.regions || '["issaquah","wenatchee","skykomish","chelan","baker","methow","waterville"]') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Check HRRR reach (day 0)
        id: reach
        run: |
          # Cheap upfront 48h-horizon test (matters for a manual future
          # target_date); no wait — day 0's window ends at f15–f27, which the
          # pipeline's auto-cycle handles itself. Same logic as the day-1 gate.
          BASE="${{ inputs.target_date }}${{ github.event.client_payload.target_date }}"
          GITHUB_OUTPUT=out.txt HRRR_WAIT_CHECKS=0 scripts/wait-hrrr.sh 0 "$BASE"
          echo "TARGET_DATE=$(sed -n 's/^target_date=//p' out.txt)" >> "$GITHUB_ENV"
          echo "reachable=$(sed -n 's/^ready=//p' out.txt)" >> "$GITHUB_OUTPUT"

      - name: Run forecast
        id: run
        if: steps.reach.outputs.reachable == 'true'
        uses: ./.github/actions/run-forecast
        with:
          model: hrrr
          region: ${{ matrix.region }}
          target_date: ${{ env.TARGET_DATE }}
          image: ${{ env.IMAGE }}

      - name: Guard — did HRRR actually reach this day?
        id: guard
        if: steps.reach.outputs.reachable == 'true'
        env:
          RENDERED: ${{ steps.run.outputs.rendered_date }}
        run: |
          # The renderer dates each windgram to the valid date of its first
          # (8am-local) timestep. If HRRR couldn't reach $TARGET_DATE, the
          # pipeline falls back to near-term data dated to an earlier day — so
          # the rendered date won't match what we asked for. Detect that and
          # skip the deploy/upload rather than publishing it under the wrong day.
          # (Zero windgrams already failed the run step.)
          if [ "$RENDERED" != "$TARGET_DATE" ]; then
            echo "::notice::HRRR did not reach $TARGET_DATE (rendered $RENDERED — beyond the 48h horizon). Skipping deploy for this day."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "Rendered ${{ steps.run.outputs.count }} windgrams for $RENDERED."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload windgrams
        if: steps.guard.outputs.deploy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hrrr-${{ matrix.region }}-day0
          path: output/*.png
          retention-days: 7

      # Only the home tile writes the v2 soaring cube; publishing is main-only.
      - name: Upload soaring cube to R2 (v2)
        if: steps.guard.outputs.deploy == 'true' && env.UPLOAD_CUBES == 'true' && matrix.region == 'issaquah' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/upload-cube
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        with:
          model: hrrr
          day: 0

  wait-day1:
    # HRRR readiness gate for the day-1 legs: one small x86 runner checks the
    # 48 h reach and polls the mirror for the newest cycle's window-end hour
    # (scripts/wait-hrrr.sh), so the arm matrix doesn't hold 7 runners idle.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
      target_date: ${{ steps.ready.outputs.target_date }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait for HRRR GRIB (day 1)
        id: ready
        run: scripts/wait-hrrr.sh 1 "${{ inputs.target_date }}${{ github.event.client_payload.target_date }}"

  forecast-day1:
    # Day 1 legs for every region; start once wait-day1 has seen the files.
    # Skipped (not failed) when the day is out of reach or the gate timed out.
    needs: wait-day1
    if: needs.wait-day1.outputs.ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        region: ${{ fromJson(inputs.regions || '["issaquah","wenatchee","skykomish","chelan","baker","methow","waterville"]') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Soaring date (day 1)
        id: reach
        run: |
          echo "Day 1 → soaring date ${{ needs.wait-day1.outputs.target_date }} (auto-cycle; gate passed)"
          echo "TARGET_DATE=${{ needs.wait-day1.outputs.target_date }}" >> "$GITHUB_ENV"
          echo "reachable=true" >> "$GITHUB_OUTPUT"

      - name: Run forecast
        id: run
        if: steps.reach.outputs.reachable == 'true'
        uses: ./.github/actions/run-forecast
        with:
          model: hrrr
          region: ${{ matrix.region }}
          target_date: ${{ env.TARGET_DATE }}
          image: ${{ env.IMAGE }}

      - name: Guard — did HRRR actually reach this day?
        id: guard
        if: steps.reach.outputs.reachable == 'true'
        env:
          RENDERED: ${{ steps.run.outputs.rendered_date }}
        run: |
          # The renderer dates each windgram to the valid date of its first
          # (8am-local) timestep. If HRRR couldn't reach $TARGET_DATE, the
          # pipeline falls back to near-term data dated to an earlier day — so
          # the rendered date won't match what we asked for. Detect that and
          # skip the deploy/upload rather than publishing it under the wrong day.
          # (Zero windgrams already failed the run step.)
          if [ "$RENDERED" != "$TARGET_DATE" ]; then
            echo "::notice::HRRR did not reach $TARGET_DATE (rendered $RENDERED — beyond the 48h horizon). Skipping deploy for this day."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "Rendered ${{ steps.run.outputs.count }} windgrams for $RENDERED."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload windgrams
        if: steps.guard.outputs.deploy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hrrr-${{ matrix.region }}-day1
          path: output/*.png
          retention-days: 7

      # Only the home tile writes the v2 soaring cube; publishing is main-only.
      - name: Upload soaring cube to R2 (v2)
        if: steps.guard.outputs.deploy == 'true' && env.UPLOAD_CUBES == 'true' && matrix.region == 'issaquah' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/upload-cube
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        with:
          model: hrrr
          day: 1

  publish:
    # One gh-pages commit for every region-day (instead of one per job). Runs
    # even when some legs failed or were skipped (out of reach), so one bad leg
    # never blocks the rest; legs without an artifact are simply not published.
    # Each leg lands in forecasts/<rendered date>/hrrr/<region>/ (so day 1 goes
    # under date+1); only day 0 updates /latest (latest_day 0), as for NAM.
    needs: [forecast-day0, forecast-day1]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: hrrr-*
          path: windgrams
      - name: Deploy to Pages
        uses: ./.github/actions/deploy-forecast
        with:
          model: hrrr
          artifacts_dir: windgrams
          latest_day: "0"
