name: Forecast (HRRR)

on:
  # Fired by the Cloudflare trigger Worker (cloudflare-trigger/), which carries
  # the target cycle in client_payload.cycle. repository_dispatch starts within
  # seconds — unlike GitHub's throttled `schedule` events, which were running
  # these forecasts ~5h late. The schedule lives in the Worker now. One dispatch
  # starts every region tile.
  repository_dispatch:
    types: [run-hrrr]
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Soaring date YYYY-MM-DD to render (blank = today UTC)'
        required: false
      regions:
        description: 'Region tiles to run, JSON list (blank = all seven)'
        required: false

env:
  # v2 soaring-cube upload to R2 is OFF (R2 cost): the pipeline still writes
  # output/soaring.zarr, it just isn't uploaded. 'true' re-enables it for the
  # issaquah tile; r2-prune.yml keeps ageing out the existing objects.
  UPLOAD_CUBES: 'false'
  IMAGE: ghcr.io/nw-paragliding/windgram:latest
  # Data root for HRRR GRIB. Default: NOAA's Open Data mirror on AWS
  # (noaa-hrrr-bdp-pds, same hrrr.YYYYMMDD/conus/ layout and .idx files as
  # NOMADS, ~1 min behind it, no throttling). Set the repository variable
  # RASP_HRRR_ROOT to https://nomads.ncep.noaa.gov/pub/data/nccf/com/hrrr/prod
  # to go back to NOMADS. Needs windgram >= 0.7.2 (older images hardcode NOMADS
  # for HRRR and ignore the variable).
  RASP_HRRR_ROOT: ${{ vars.RASP_HRRR_ROOT || 'https://noaa-hrrr-bdp-pds.s3.amazonaws.com' }}

jobs:
  forecast:
    # Seven region tiles x two soaring days (day 0 = base date, default today
    # UTC; day 1 = base + 1) = 14 jobs, like NAM/RRFS. HRRR's 00/06/12/18z
    # cycles reach 48 h, so whether a day is reachable depends on the dispatch:
    #
    #   dispatch   newest cycle  day 0 (window end)     day 1 (window end)
    #   01:15z     00z           tomorrow-PDT (27 h)    skipped (51 h > 48 h)
    #   07:15z     06z           today (21 h)           tomorrow (45 h)
    #   13:00z     12z           today (15 h)           tomorrow (39 h)
    #
    # The reach step decides this per day: an out-of-reach day ends its job in
    # seconds with a ::notice (job success, no artifact, nothing published).
    # PR #41 (2026-07) dropped day 1 because its deep forecast hours (fhr 27–45)
    # produced garbage; the cause was a WRF instability (NaN after hours of
    # integration), fixed by `dynamics: {epssm: 0.5}` in every tile (windgram
    # >= 0.7.3), so the second day is back.
    #
    # HRRR feeds the same DrJack 4 km → 1.33 km chain as the NAM/RRFS products:
    # the job's domain config is domains/<region>.yaml with `model: hrrr` and the
    # DrJack-chain override keys of domains/cascades-hrrr.yaml appended at run
    # time (scripts/derive-domain.sh), so it shares the tile's geo_em cache and
    # runs in the NAM product's auto --target-date mode. "HRRR (beta)" on the site.
    strategy:
      fail-fast: false
      matrix:
        region: ${{ fromJson(inputs.regions || '["issaquah","wenatchee","skykomish","chelan","baker","methow","waterville"]') }}
        day: [0, 1]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Check HRRR reach (day ${{ matrix.day }})
        id: reach
        env:
          DAY: ${{ matrix.day }}
        run: |
          # Cheap upfront 48h-horizon test, so an out-of-reach day (day 1 in the
          # 01:15z run) exits in seconds instead of running a full WRF sim it
          # would only discard. The post-render Guard below still backstops the
          # publish-lag borderline case.
          BASE="${{ inputs.target_date }}${{ github.event.client_payload.target_date }}"
          [ -z "$BASE" ] && BASE=$(date -u +%F)
          TARGET_DATE=$(date -u -d "$BASE +${DAY} days" +%F)
          echo "TARGET_DATE=$TARGET_DATE" >> "$GITHUB_ENV"

          # Soaring window for TARGET_DATE ends 8pm local (PDT=UTC-7) = 03:00z
          # the next day.
          END_DATE=$(date -u -d "$TARGET_DATE +1 day" +%F)
          END_EPOCH=$(date -u -d "$END_DATE 03:00:00Z" +%s)

          # Best case: the newest HRRR cycle already initialized (00/06/12/18z
          # today) minimizes the forecast hour to the window end — if even it
          # can't reach, no cycle can. HRRR tops out at 48h.
          H=$(( 10#$(date -u +%H) ))
          CYC=$(printf '%02d' $(( (H / 6) * 6 )))
          # The run itself is NOT pinned to this cycle: it uses the NAM product's
          # auto --target-date mode, where the pipeline takes the freshest cycle
          # whose files for the whole window are already published and starts
          # WRF at the window start (fhr >= 3). The HRRR registry lists only the
          # 00/06/12/18z cycles (the ones with 48h of GRIB), so the 18h hourly
          # cycles are never chosen.
          echo "CYC=$CYC" >> "$GITHUB_ENV"
          CYC_DATE=$(date -u +%F)
          CYCLE_EPOCH=$(date -u -d "$CYC_DATE ${CYC}:00:00Z" +%s)
          FHR_END=$(( (END_EPOCH - CYCLE_EPOCH) / 3600 ))

          echo "Day $DAY → $TARGET_DATE: window ends ${FHR_END}h past newest cycle (${CYC}z); HRRR reach 48h."
          if [ "$FHR_END" -gt 48 ]; then
            echo "::notice::HRRR can't reach $TARGET_DATE (day $DAY: ${FHR_END}h > 48h horizon). Skipping this day — NAM/RRFS carry it."
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Day 1 only: the dispatch fires ~15 min after its cycle starts
          # publishing, before the deep hour that ends day 1's window (f45 for
          # 06z, f39 for 12z, ~07:45z / ~13:40z on the AWS mirror). Left alone,
          # auto mode would take the previous cycle six hours deeper (13:00z) or
          # find no covering cycle at all (07:15z: 00z would need f51) and fall
          # back to near-term data that the Guard then throws away. So wait for
          # the newest cycle's window-end files (wrfprs + wrfsfc and their .idx,
          # the pipeline's own readiness test). Day 0's window ends at f15–f27,
          # which the pipeline already handles without waiting.
          if [ "$DAY" -ge 1 ]; then
            DC=$(date -u -d "$CYC_DATE" +%Y%m%d)
            F=$(printf '%02d' "$FHR_END")
            URLS=()
            for k in prs sfc; do
              u="${RASP_HRRR_ROOT}/hrrr.${DC}/conus/hrrr.t${CYC}z.wrf${k}f${F}.grib2"
              URLS+=("$u" "$u.idx")
            done
            ready() { for u in "${URLS[@]}"; do curl -sfI -o /dev/null --max-time 20 "$u" || return 1; done; }
            WAITED=0; MAX=75
            until ready; do
              if [ "$WAITED" -ge "$MAX" ]; then
                echo "::notice::HRRR ${CYC}z f${F} not published after ${MAX} min; skipping $TARGET_DATE (day $DAY) rather than rendering an older, deeper cycle."
                echo "reachable=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "HRRR ${CYC}z f${F} not published yet (waited ${WAITED} min); sleeping 3 min"
              sleep 180; WAITED=$((WAITED + 3))
            done
            echo "HRRR ${CYC}z f${F} published (waited ${WAITED} min)."
          fi
          echo "reachable=true" >> "$GITHUB_OUTPUT"

      - name: Run forecast
        id: run
        if: steps.reach.outputs.reachable == 'true'
        uses: ./.github/actions/run-forecast
        with:
          model: hrrr
          region: ${{ matrix.region }}
          target_date: ${{ env.TARGET_DATE }}
          image: ${{ env.IMAGE }}

      - name: Guard — did HRRR actually reach this day?
        id: guard
        if: steps.reach.outputs.reachable == 'true'
        env:
          RENDERED: ${{ steps.run.outputs.rendered_date }}
        run: |
          # The renderer dates each windgram to the valid date of its first
          # (8am-local) timestep. If HRRR couldn't reach $TARGET_DATE (next-day
          # in the evening run is ~51h out, past the 48h limit), the pipeline
          # falls back to near-term data dated to *today* — so the rendered date
          # won't match what we asked for. Detect that and skip the deploy/upload
          # for this day rather than publishing today's data under tomorrow.
          # (Zero windgrams already failed the run step.)
          if [ "$RENDERED" != "$TARGET_DATE" ]; then
            echo "::notice::HRRR did not reach $TARGET_DATE (rendered $RENDERED — beyond the 48h horizon). Skipping deploy for this day."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "Rendered ${{ steps.run.outputs.count }} windgrams for $RENDERED."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload windgrams
        if: steps.guard.outputs.deploy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hrrr-${{ matrix.region }}-day${{ matrix.day }}
          path: output/*.png
          retention-days: 7

      # Only the home tile writes the v2 soaring cube; publishing is main-only.
      - name: Upload soaring cube to R2 (v2)
        if: steps.guard.outputs.deploy == 'true' && env.UPLOAD_CUBES == 'true' && matrix.region == 'issaquah' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/upload-cube
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        with:
          model: hrrr
          day: ${{ matrix.day }}

  publish:
    # One gh-pages commit for every region-day (instead of one per job). Runs
    # even when some legs failed or were skipped (out of reach), so one bad leg
    # never blocks the rest; legs without an artifact are simply not published.
    # Each leg lands in forecasts/<rendered date>/hrrr/<region>/ (so day 1 goes
    # under date+1); only day 0 updates /latest (latest_day 0), as for NAM.
    needs: forecast
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: hrrr-*
          path: windgrams
      - name: Deploy to Pages
        uses: ./.github/actions/deploy-forecast
        with:
          model: hrrr
          artifacts_dir: windgrams
          latest_day: "0"
