name: Forecast (HRRR 1km)

on:
  schedule:
    # NOAA publishes HRRR data ~1h25 after cycle init (00z ready ~01:25z, 12z
    # ready ~13:10z). We fire a few hours BEFORE that and let the pipeline poll
    # NOMADS, so the job is already awake and runs the instant data lands.
    # Off-the-top-of-the-hour minutes dodge GitHub's worst schedule-dispatch lag.
    # The 1km nest adds ~2h25 of compute, so the morning run fires earliest.
    - cron: '27 0 * * *'      # Target 00z cycle (evening planning); data ~01:25z
    - cron: '52 9 * * *'      # Target 12z cycle (morning refresh); data ~13:10z
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target date YYYY-MM-DD (blank = auto)'
        required: false

env:
  IMAGE: ghcr.io/nw-paragliding/windgram:latest

jobs:
  forecast:
    runs-on: ubuntu-24.04-arm
    # Budget: up to 4h sleep (from --not-before compensation) + ~15 min runtime
    timeout-minutes: 360
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Restore geo_em cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: geo_em/
          key: geo-em-cascades-hrrr-1km-v2

      - name: Download geo_em from release (cache miss fallback)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p geo_em
          gh release download geo-em-v1 --pattern 'geo_em_hrrr-1km.tar.gz' --dir .
          tar xzf geo_em_hrrr-1km.tar.gz -C geo_em
          rm geo_em_hrrr-1km.tar.gz
          echo "Downloaded geo_em from release:"
          ls -lh geo_em/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull $IMAGE

      - name: Run forecast
        run: |
          mkdir -p output
          TARGET_DATE="${{ inputs.target_date }}"
          TARGET_FLAG=""
          if [ -n "$TARGET_DATE" ]; then
            TARGET_FLAG="--target-date $TARGET_DATE"
          fi

          # Pass --target-cycle based on which cron fired (no-op for manual dispatch).
          CYCLE_FLAG=""
          case "${{ github.event.schedule }}" in
            '27 0 * * *')  CYCLE_FLAG="--target-cycle 0" ;;   # evening: 00z cycle
            '52 9 * * *')  CYCLE_FLAG="--target-cycle 12" ;;  # morning: 12z cycle
          esac

          docker run --rm \
            -v ${{ github.workspace }}/geo_em:/mnt/geo_em:ro \
            -v ${{ github.workspace }}/output:/mnt/output:rw \
            -v ${{ github.workspace }}/domains/cascades-hrrr-1km.yaml:/opt/rasp/domain.yaml:ro \
            -v ${{ github.workspace }}/sites/issaquah-sites.csv:/opt/rasp/sites.csv:ro \
            --entrypoint bash \
            $IMAGE -c "
              cp /mnt/geo_em/geo_em.d0*.nc /opt/rasp/wps/ 2>/dev/null || true
              python3 -m rasp.pipeline domain.yaml \
                --sites sites.csv \
                --output-dir /mnt/output \
                --num-procs 4 \
                $CYCLE_FLAG \
                $TARGET_FLAG
            "

      - name: Check forecast output
        run: |
          count=$(ls output/*.png 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::No windgrams rendered — model produced no usable output (likely bad/NaN model data)."
            exit 1
          fi
          echo "Rendered $count windgrams."

      - name: Save geo_em cache
        if: hashFiles('geo_em/geo_em.d01.nc') != ''
        uses: actions/cache/save@v4
        with:
          path: geo_em/
          key: geo-em-cascades-hrrr-1km-v2

      - name: Upload windgrams
        uses: actions/upload-artifact@v4
        with:
          name: hrrr-1km-windgrams
          path: output/*.png
          retention-days: 7

      - name: Deploy to Pages
        uses: ./.github/actions/deploy-forecast
        with:
          model: hrrr-1km
