name: Deploy forecast to Pages
description: >-
  Stage the rendered windgrams for a model into the gh-pages branch and push,
  retrying with a rebase when concurrent forecast workflows race on the branch.

inputs:
  model:
    description: Model slug, used as the forecasts/<date>/<model> subdir (e.g. nam, hrrr)
    required: true

runs:
  using: composite
  steps:
    - name: Deploy to Pages
      shell: bash
      env:
        MODEL: ${{ inputs.model }}
      run: |
        # Determine date from output filenames
        DATE=$(ls output/*.png | head -1 | xargs basename | cut -d_ -f1)

        # Clone gh-pages (orphan fallback for first-ever deploy)
        git fetch origin gh-pages || true
        git worktree add pages origin/gh-pages 2>/dev/null || {
          git worktree add pages --orphan gh-pages-new
          cd pages && git checkout --orphan gh-pages && cd ..
        }

        # Stage forecast files
        mkdir -p "pages/forecasts/${DATE}/${MODEL}"
        for f in output/*.png; do
          NEWNAME=$(basename "$f" | sed 's/^[0-9-]*_//')
          cp "$f" "pages/forecasts/${DATE}/${MODEL}/${NEWNAME}"
        done
        echo "{\"model\":\"${MODEL}\",\"date\":\"${DATE}\",\"generated\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" \
          > "pages/forecasts/${DATE}/${MODEL}/metadata.json"

        # Update latest
        rm -rf "pages/forecasts/latest/${MODEL}"
        mkdir -p "pages/forecasts/latest/${MODEL}"
        cp "pages/forecasts/${DATE}/${MODEL}/"* "pages/forecasts/latest/${MODEL}/"

        # Generate sites.json and refresh frontend
        python3 site/generate-sites-json.py sites/issaquah-sites.csv > pages/sites.json
        cp site/index.html pages/index.html

        # Cleanup old forecasts (>7 days)
        CUTOFF=$(date -d '7 days ago' +%Y-%m-%d 2>/dev/null || date -v-7d +%Y-%m-%d 2>/dev/null || echo "")
        if [ -n "$CUTOFF" ]; then
          for dir in pages/forecasts/20??-??-??; do
            [ -d "$dir" ] || continue
            DIR_DATE=$(basename "$dir")
            if [[ "$DIR_DATE" < "$CUTOFF" ]]; then
              rm -rf "$dir"
            fi
          done
        fi

        # Commit
        cd pages
        git add -A
        git diff --cached --quiet && echo "No changes" && exit 0
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git commit -m "Update ${MODEL} forecast for ${DATE}"

        # Push with retry: other forecast workflows push to gh-pages
        # concurrently. On rejection, rebase our commit onto the latest
        # remote tip and retry (models write to disjoint subdirs, so this
        # rebases cleanly).
        for attempt in 1 2 3 4 5; do
          if git push origin HEAD:gh-pages; then
            echo "Pushed on attempt $attempt"
            exit 0
          fi
          echo "Push rejected (attempt $attempt); rebasing on latest gh-pages..."
          git fetch origin gh-pages
          git rebase origin/gh-pages || { git rebase --abort; exit 1; }
          sleep $((RANDOM % 5 + 1))
        done
        echo "Failed to push after 5 attempts" >&2
        exit 1
