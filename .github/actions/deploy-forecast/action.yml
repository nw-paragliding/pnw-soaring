name: Deploy forecast to Pages
description: >-
  Publish one forecast run's windgrams (every region and day of one model) to
  the gh-pages branch in a single commit, retrying with a rebase when concurrent
  forecast workflows race on the branch. Called once per workflow run by the
  `publish` job, after the forecast matrix.

inputs:
  model:
    description: Model slug (nam, rrfs, hrrr)
    required: true
  artifacts_dir:
    description: >-
      Directory holding the downloaded windgram artifacts, one subdirectory per
      matrix leg named <model>-<region>-day<N> (each with that leg's PNGs).
    required: true
  latest_day:
    description: >-
      Which day's windgrams also go to forecasts/latest/<model>/<region>
      (default 0: /latest stays "today"; the day picker reads the date dirs).
    required: false
    default: "0"

runs:
  using: composite
  steps:
    - name: Deploy to Pages
      shell: bash
      env:
        MODEL: ${{ inputs.model }}
        ARTS: ${{ inputs.artifacts_dir }}
        LATEST_DAY: ${{ inputs.latest_day }}
      run: |
        # Layout (region level added under the existing date/model dirs):
        #   forecasts/<date>/<model>/metadata.json             (day picker probe)
        #   forecasts/<date>/<model>/<region>/<Site>_windgram.png + <Site>_blipspot.json + metadata.json
        #   forecasts/latest/<model>/metadata.json              (toggle freshness)
        #   forecasts/latest/<model>/<region>/<Site>_windgram.png + <Site>_blipspot.json + metadata.json
        # <Site>_blipspot.json is the hourly table behind the chart (windgram
        # image >= 0.8.0 writes it beside each PNG; older images produce none and
        # the site's Table view then says "no table yet").
        shopt -s nullglob
        LEGS=("$ARTS"/"$MODEL"-*-day*)
        if [ ${#LEGS[@]} -eq 0 ]; then
          echo "::warning::No $MODEL windgram artifacts to publish (every leg failed or was skipped)."
          exit 0
        fi

        # Clone gh-pages (orphan fallback for first-ever deploy)
        git fetch origin gh-pages || true
        git worktree add pages origin/gh-pages 2>/dev/null || {
          git worktree add pages --orphan gh-pages-new
          cd pages && git checkout --orphan gh-pages && cd ..
        }

        GEN=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        DATES=""; LATEST_DATES=""   # space-separated unique dates touched
        SUMMARY=""
        for leg in "${LEGS[@]}"; do
          name=$(basename "$leg")                 # <model>-<region>-day<N>
          rest=${name#"$MODEL"-}; REGION=${rest%-day*}; DAY=${rest##*-day}
          PNGS=("$leg"/*.png)
          [ ${#PNGS[@]} -gt 0 ] || { echo "::warning::$name has no PNGs; skipping"; continue; }
          DATE=$(basename "${PNGS[0]}" | cut -d_ -f1)
          DEST="pages/forecasts/${DATE}/${MODEL}/${REGION}"
          rm -rf "$DEST"; mkdir -p "$DEST"
          for f in "${PNGS[@]}" "$leg"/*_blipspot.json; do
            cp "$f" "$DEST/$(basename "$f" | sed 's/^[0-9-]*_//')"   # drop the date prefix
          done
          echo "{\"model\":\"${MODEL}\",\"region\":\"${REGION}\",\"date\":\"${DATE}\",\"generated\":\"${GEN}\",\"windgrams\":${#PNGS[@]}}" > "$DEST/metadata.json"
          case " $DATES " in *" $DATE "*) ;; *) DATES="$DATES $DATE" ;; esac
          if [ "$DAY" = "$LATEST_DAY" ]; then
            L="pages/forecasts/latest/${MODEL}/${REGION}"
            rm -rf "$L"; mkdir -p "$L"; cp "$DEST/"* "$L/"
            LATEST_DATES="$DATE"
          fi
          SUMMARY+="${REGION} day${DAY} -> ${DATE}: ${#PNGS[@]} windgrams"$'\n'
        done
        printf '%s' "$SUMMARY"

        # Model-level metadata.json per date dir (what the site's day picker
        # probes) and for latest (what the model toggle's "Nh ago" reads). The
        # pre-region flat PNGs at those levels are removed as they are superseded.
        for DATE in $DATES; do
          D="pages/forecasts/${DATE}/${MODEL}"
          rm -f "$D"/*.png
          echo "{\"model\":\"${MODEL}\",\"date\":\"${DATE}\",\"generated\":\"${GEN}\"}" > "$D/metadata.json"
        done
        if [ -n "$LATEST_DATES" ]; then
          D="pages/forecasts/latest/${MODEL}"
          rm -f "$D"/*.png
          echo "{\"model\":\"${MODEL}\",\"date\":\"${LATEST_DATES}\",\"generated\":\"${GEN}\"}" > "$D/metadata.json"
        fi

        # The frontend (index.html, sites.json, v2/) is NOT touched here: it is
        # deployed only by deploy-site.yml on push to main. Copying it from the
        # forecast run's checkout let a run that started before a frontend merge
        # overwrite the new index.html with the old one (2026-10-22 05:06Z).

        # Cleanup old forecasts (>7 days)
        CUTOFF=$(date -d '7 days ago' +%Y-%m-%d 2>/dev/null || date -v-7d +%Y-%m-%d 2>/dev/null || echo "")
        if [ -n "$CUTOFF" ]; then
          for dir in pages/forecasts/20??-??-??; do
            [ -d "$dir" ] || continue
            DIR_DATE=$(basename "$dir")
            if [[ "$DIR_DATE" < "$CUTOFF" ]]; then
              rm -rf "$dir"
            fi
          done
        fi

        # Commit
        cd pages
        git add -A
        git diff --cached --quiet && echo "No changes" && exit 0
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git commit -q -m "Update ${MODEL} forecast:${DATES} (${#LEGS[@]} region-days)"

        # Push with retry: other forecast workflows push to gh-pages
        # concurrently. On rejection, rebase our commit onto the latest
        # remote tip and retry (models write to disjoint subdirs, so this
        # rebases cleanly).
        for attempt in 1 2 3 4 5; do
          if git push origin HEAD:gh-pages; then
            echo "Pushed on attempt $attempt"
            exit 0
          fi
          echo "Push rejected (attempt $attempt); rebasing on latest gh-pages..."
          git fetch origin gh-pages
          # Replay ONLY this job's own commit (--onto ... HEAD~1): squash-gh-pages.yml
          # may have rewritten gh-pages as a new root since our fetch, and a plain
          # rebase onto an unrelated root would replay the whole history.
          git rebase --onto origin/gh-pages HEAD~1 || { git rebase --abort; exit 1; }
          sleep $((RANDOM % 5 + 1))
        done
        echo "Failed to push after 5 attempts" >&2
        exit 1
