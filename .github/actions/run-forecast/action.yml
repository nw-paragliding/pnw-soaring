name: Run one region forecast
description: >-
  Render one region tile's windgrams for one model and one soaring day:
  derive the model's domain config from domains/<region>.yaml, restore (or
  build with geogrid and cache) the tile's geo_em grids, run the windgram image,
  and check that it rendered something. Used by forecast-rrfs/-hrrr.yml;
  uploading and publishing are left to the calling workflow.

inputs:
  model:
    description: nam | rrfs | hrrr
    required: true
  region:
    description: Region tile name (domains/<region>.yaml + sites/<region>-sites.csv)
    required: true
  target_date:
    description: Soaring date YYYY-MM-DD (the pipeline auto-selects the freshest covering cycle)
    required: true
  image:
    description: Windgram image
    required: true

outputs:
  count:
    description: Number of windgrams rendered
    value: ${{ steps.check.outputs.count }}
  rendered_date:
    description: Date stamped on the rendered windgrams (YYYY-MM-DD)
    value: ${{ steps.check.outputs.rendered_date }}
  sites:
    description: Number of sites in the region's site list
    value: ${{ steps.prep.outputs.sites }}
  attempts:
    description: Pipeline attempts the leg took (1, or 2 after one early transient failure)
    value: ${{ steps.forecast.outputs.attempts }}

runs:
  using: composite
  steps:
    - name: Free up disk space
      shell: bash
      run: |
        echo "Disk before cleanup:"; df -h /
        sudo rm -rf \
          /usr/local/lib/android \
          /usr/share/dotnet \
          /opt/ghc /usr/local/.ghcup \
          /opt/hostedtoolcache \
          /usr/local/share/boost 2>/dev/null || true
        docker system prune -af 2>/dev/null || true
        echo "Disk after cleanup:"; df -h /

    # Registry login and image pull: three attempts each, 15 s apart. This
    # replaces docker/login-action, which has no retry: one HRRR leg on
    # 2026-11-16 died 51 s in on `Get "https://ghcr.io/v2/": EOF`. The package
    # (ghcr.io/nw-paragliding/windgram) is public, so a login that still fails
    # after three tries is only a warning and the pull goes ahead anonymously;
    # the visibility is checked first (packages API, then the registry's own
    # anonymous-token probe), and a package not known to be public keeps a
    # failed login fatal, as before.
    - name: Log in to ghcr.io and pull image
      id: pull
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        ACTOR: ${{ github.actor }}
        GH_TOKEN: ${{ github.token }}
      run: |
        # ghcr.io/<org>/<package>[:tag|@digest] -> org + package name
        PKG_PATH=${IMAGE#ghcr.io/}; PKG_PATH=${PKG_PATH%%@*}; PKG_PATH=${PKG_PATH%%:*}
        ORG=${PKG_PATH%%/*}; PKG=${PKG_PATH#*/}
        VIS=$(gh api "/orgs/$ORG/packages/container/$PKG" --jq .visibility 2>/dev/null) || VIS=unknown
        echo "Package $ORG/$PKG visibility: $VIS (packages API)"
        if [ "$VIS" != public ]; then
          # The packages API wants read:packages; the registry answers for free:
          # a public package hands out an anonymous pull token and lists its tags.
          TOK=$(curl -fsS --max-time 20 "https://ghcr.io/token?scope=repository:${PKG_PATH}:pull" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p' || true)
          if [ -n "$TOK" ] && [ "$(curl -sS -o /dev/null --max-time 20 -w '%{http_code}' \
              -H "Authorization: Bearer $TOK" "https://ghcr.io/v2/${PKG_PATH}/tags/list")" = 200 ]; then
            VIS="public"
            echo "Package $ORG/$PKG visibility: public (anonymous registry probe)"
          fi
        fi

        logged_in=false
        for attempt in 1 2 3; do
          if echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin; then
            echo "ghcr.io login OK (attempt $attempt of 3)"
            logged_in=true
            break
          fi
          echo "ghcr.io login failed (attempt $attempt of 3)"
          if [ "$attempt" -lt 3 ]; then sleep 15; fi
        done
        if [ "$logged_in" != true ]; then
          if [ "$VIS" = public ]; then
            echo "::warning::ghcr.io login failed 3 times; $ORG/$PKG is public, pulling anonymously"
          else
            echo "::error::ghcr.io login failed 3 times and $ORG/$PKG is not known to be public (visibility: $VIS)"
            exit 1
          fi
        fi

        for attempt in 1 2 3; do
          if docker pull "$IMAGE"; then
            echo "Pulled $IMAGE (attempt $attempt of 3)"
            exit 0
          fi
          echo "docker pull failed (attempt $attempt of 3)"
          if [ "$attempt" -lt 3 ]; then sleep 15; fi
        done
        echo "::error::docker pull $IMAGE failed 3 times"
        exit 1

    - name: Prepare domain config (${{ inputs.region }} / ${{ inputs.model }})
      id: prep
      shell: bash
      env:
        REGION: ${{ inputs.region }}
        MODEL: ${{ inputs.model }}
        IMAGE: ${{ inputs.image }}
      run: |
        SRC="domains/${REGION}.yaml"; SITES="sites/${REGION}-sites.csv"
        [ -f "$SRC" ] || { echo "::error::no domain config $SRC"; exit 1; }
        [ -f "$SITES" ] || { echo "::error::no site list $SITES"; exit 1; }
        mkdir -p job geo_em output
        scripts/derive-domain.sh "$SRC" "$MODEL" job/domain.yaml
        cp "$SITES" job/sites.csv
        N=$(grep -cvE '^\s*(#|$)' job/sites.csv)
        # geo_em depends only on the tile geometry, which is the same for every
        # model, so the key is the NAM source file's hash (not the derived one).
        # The image is part of the key too: geogrid output depends on the
        # generator (e.g. windgram >= 0.7.0 honours the shared `lattice:` block,
        # older images ignore it), so a new image rebuilds the grid once.
        IMG=$(docker image inspect --format '{{.Id}}' "$IMAGE" | sed 's/^sha256://' | cut -c1-12)
        echo "geo_key=geo-em-${REGION}-$(sha256sum "$SRC" | cut -c1-16)-img${IMG}" >> "$GITHUB_OUTPUT"
        echo "sites=$N" >> "$GITHUB_OUTPUT"
        echo "Region $REGION, model $MODEL, $N sites; derived config:"
        grep -nE '^(name|model|center_lat|center_lon|inner_extent_km|geog_data_res|direct_reader|vtable|sfc_vtable):' job/domain.yaml

    - name: Restore geo_em cache
      id: geo
      uses: actions/cache/restore@v4
      with:
        path: geo_em/
        key: ${{ steps.prep.outputs.geo_key }}

    # Cache miss (new tile, or domains/<region>.yaml changed): fetch the GEOG
    # static data and let the pipeline run geogrid; the grids are saved below.
    - name: Restore GEOG cache (geo_em miss)
      id: geog
      if: steps.geo.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: geog/
        key: wps-geog-lowres-plus-30s-v1

    - name: Download GEOG (low-res package + 30s terrain/landuse, ~0.6 GB)
      if: steps.geo.outputs.cache-hit != 'true' && steps.geog.outputs.cache-hit != 'true'
      shell: bash
      run: |
        BASE=https://www2.mmm.ucar.edu/wrf/src/wps_files
        curl -fL --retry 3 -sS "$BASE/geog_low_res_mandatory.tar.gz" -o geog.tar.gz
        mkdir -p geog && tar xzf geog.tar.gz -C geog --strip-components=1 && rm geog.tar.gz
        for t in topo_gmted2010_30s modis_landuse_20class_30s_with_lakes; do
          curl -fL --retry 3 -sS "$BASE/$t.tar.bz2" -o add.tar.bz2
          tar xjf add.tar.bz2 -C geog && rm add.tar.bz2
        done
        du -sh geog

    - name: Save GEOG cache
      if: steps.geo.outputs.cache-hit != 'true' && steps.geog.outputs.cache-hit != 'true'
      continue-on-error: true   # parallel legs race for the same key; one wins
      uses: actions/cache/save@v4
      with:
        path: geog/
        key: wps-geog-lowres-plus-30s-v1

    # One automatic retry for an early failure. The 2026-11-10..17 audit found
    # 21 production legs lost to transient errors ~90 s in: the AWS mirror
    # replicates a cycle's forecast hours out of order, so an hour the pipeline
    # needed was HTTP 404 and landed 2-3 min later (18 HRRR legs, 2 GFS legs),
    # plus the ghcr.io EOF above. A pipeline exit within the first 8 min is one
    # of those (data, registry or network: WRF has not really started), so the
    # leg wipes its output and runs the pipeline once more after 3 min; a later
    # failure (WRF blow-ups are not transient) or a second one fails the step
    # as before. Re-running the job from GitHub is the wrong tool: it drags the
    # dependent waves back through and re-fires the workflow_run chains.
    # The step output `attempts` (1 or 2) says what it took.
    #
    # Test hook: RUN_FORECAST_FAIL_FIRST=1 in the environment (never set by any
    # workflow; put it in a temporary workflow `env:` edit on a branch) makes
    # attempt 1 exit 1 after 10 s instead of running the pipeline, so the retry
    # path can be exercised end to end (attempts=2, windgrams from attempt 2).
    - name: Run forecast (${{ inputs.region }} / ${{ inputs.model }} / ${{ inputs.target_date }})
      id: forecast
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        TARGET_DATE: ${{ inputs.target_date }}
        REGION: ${{ inputs.region }}
        MODEL: ${{ inputs.model }}
        EARLY_FAIL_S: "480"   # a failure this soon after the start is retried once
        RETRY_SLEEP_S: "180"  # the mirror's out-of-order hours land 2-3 min late
      run: |
        echo "$REGION: soaring date $TARGET_DATE (auto-cycle)"
        EXTRA=()
        [ -d geog ] && EXTRA+=(-v "$PWD/geog:/mnt/geog:ro")
        # GRIB data roots (forecast-rrfs/-hrrr.yml env: AWS mirror or NOMADS);
        # the image honours the same vars.
        [ -n "${RASP_RRFS_ROOT:-}" ] && EXTRA+=(-e "RASP_RRFS_ROOT=$RASP_RRFS_ROOT")
        [ -n "${RASP_HRRR_ROOT:-}" ] && EXTRA+=(-e "RASP_HRRR_ROOT=$RASP_HRRR_ROOT")
        [ -n "${RASP_GFS_ROOT:-}" ] && EXTRA+=(-e "RASP_GFS_ROOT=$RASP_GFS_ROOT")
        [ -n "${RASP_HRDPS_ROOT:-}" ] && EXTRA+=(-e "RASP_HRDPS_ROOT=$RASP_HRDPS_ROOT")
        # geo_em/ is mounted rw: a cached grid is copied into the WPS dir (the
        # pipeline then skips geogrid); on a miss the pipeline runs geogrid and
        # the fresh grids are copied back out for the cache save below.
        run_pipeline() {
          docker run --rm \
            "${EXTRA[@]}" \
            -v "$PWD/geo_em:/mnt/geo_em:rw" \
            -v "$PWD/output:/mnt/output:rw" \
            -v "$PWD/job/domain.yaml:/opt/rasp/domain.yaml:ro" \
            -v "$PWD/job/sites.csv:/opt/rasp/sites.csv:ro" \
            --entrypoint bash \
            "$IMAGE" -c "
              cp /mnt/geo_em/geo_em.d0*.nc /opt/rasp/wps/ 2>/dev/null || true
              python3 -m rasp.pipeline domain.yaml \
                --sites sites.csv \
                --output-dir /mnt/output \
                --num-procs 4 \
                --target-date $TARGET_DATE; EC=\$?
              if [ ! -f /mnt/geo_em/geo_em.d01.nc ] && [ -f /opt/rasp/wps/geo_em.d01.nc ]; then
                cp /opt/rasp/wps/geo_em.d0*.nc /mnt/geo_em/ && echo 'geo_em: copied fresh geogrid output out for caching'
              fi
              exit \$EC
            "
        }

        attempt=1
        while :; do
          LOG="forecast-attempt-$attempt.log"
          START=$SECONDS
          set +e
          if [ "$attempt" -eq 1 ] && [ "${RUN_FORECAST_FAIL_FIRST:-}" = 1 ]; then
            echo "RUN_FORECAST_FAIL_FIRST=1: attempt 1 is a simulated early failure (test hook), exit 1 in 10 s"
            sleep 10
            echo "  ERROR: simulated early failure (RUN_FORECAST_FAIL_FIRST=1 test hook)" | tee "$LOG"
            EC=1
          else
            run_pipeline 2>&1 | tee "$LOG"; EC=${PIPESTATUS[0]}
          fi
          set -e
          ELAPSED=$(( SECONDS - START ))
          echo "attempt $attempt: pipeline exit $EC after ${ELAPSED}s"
          if [ "$EC" -eq 0 ]; then break; fi
          if [ "$attempt" -ge 2 ] || [ "$ELAPSED" -ge "$EARLY_FAIL_S" ]; then
            echo "attempts=$attempt" >> "$GITHUB_OUTPUT"
            if [ "$attempt" -ge 2 ]; then WHY="second failure"; else WHY="failed ${ELAPSED}s in, past the ${EARLY_FAIL_S}s early-failure limit"; fi
            echo "$REGION/$MODEL: attempt $attempt $WHY; not retrying"
            exit "$EC"
          fi
          # Early failure: say what killed it, start the next attempt clean. The
          # GRIB downloads live inside the container and went with it (--rm);
          # output/ is the only host-side state of the attempt. geo_em/ stays:
          # it is the restored cache, or geogrid output worth keeping.
          LAST=$(grep -aE 'ERROR|HTTP|FATAL' "$LOG" | tail -1)
          [ -n "$LAST" ] || LAST=$(grep -av '^[[:space:]]*$' "$LOG" | tail -1)
          echo "::warning::$REGION/$MODEL: attempt $attempt failed ${ELAPSED}s in (exit $EC), retrying once in ${RETRY_SLEEP_S}s. Last error: $LAST"
          rm -rf output && mkdir output
          sleep "$RETRY_SLEEP_S"
          attempt=$(( attempt + 1 ))
        done
        echo "attempts=$attempt" >> "$GITHUB_OUTPUT"

    - name: Check forecast output
      id: check
      shell: bash
      run: |
        count=$(ls output/*.png 2>/dev/null | wc -l)
        echo "count=$count" >> "$GITHUB_OUTPUT"
        if [ "$count" -eq 0 ]; then
          echo "::error::No windgrams rendered — model produced no usable output (likely bad/NaN model data)."
          exit 1
        fi
        RENDERED=$(ls output/*.png | head -1 | xargs basename | cut -d_ -f1)
        echo "rendered_date=$RENDERED" >> "$GITHUB_OUTPUT"
        echo "Rendered $count windgrams (of ${{ steps.prep.outputs.sites }} sites) for $RENDERED (attempts: ${{ steps.forecast.outputs.attempts }})."

    - name: Save geo_em cache
      if: always() && steps.geo.outputs.cache-hit != 'true' && hashFiles('geo_em/geo_em.d02.nc') != ''
      continue-on-error: true   # day-0/day-1 legs race for the same key; one wins
      uses: actions/cache/save@v4
      with:
        path: geo_em/
        key: ${{ steps.prep.outputs.geo_key }}

    # Small (~2 MB) diagnostic copy of the tile's grids, e.g. to check that
    # neighbouring tiles' XLAT_M/XLONG_M agree on the shared lattice.
    - name: Upload geo_em (diagnostic)
      if: always() && hashFiles('geo_em/geo_em.d02.nc') != ''
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: geo-em-${{ inputs.model }}-${{ inputs.region }}-${{ inputs.target_date }}
        path: geo_em/geo_em.d0*.nc
        retention-days: 3
