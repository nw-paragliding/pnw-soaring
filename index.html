<!DOCTYPE html>
<html lang="en">
<head>
  <title>PNW Soaring Forecast</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink:       #1c2622;   /* deep evergreen-black text */
      --ink-soft:  #4a554f;
      --paper:     #f3efe6;   /* warm topo paper */
      --paper-2:   #e9e2cf00; /* (unused placeholder) */
      --panel:     #fbf9f4;
      --evergreen: #1f5240;   /* primary */
      --evergreen-d:#163a2d;
      --thermal:   #e0662a;   /* lift / accent */
      --sky:       #3d7ea6;
      --line:      rgba(28,38,34,0.12);
      --line-2:    rgba(28,38,34,0.18);
      --stale:     #b67410;
      --fresh:     #2f8f5b;
      --shadow:    0 1px 2px rgba(28,38,34,.06), 0 8px 24px -12px rgba(28,38,34,.28);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Bricolage Grotesque', system-ui, sans-serif;
      color: var(--ink);
      background: var(--paper);
      -webkit-font-smoothing: antialiased;
    }

    #app { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }

    /* ── Sidebar ───────────────────────────────────────────────── */
    #sidebar {
      flex: 0 0 40%;
      min-width: 380px;
      max-width: 640px;
      height: 100%;
      overflow-y: auto;
      position: relative;
      background: var(--paper);
      /* faint topographic contour wash for atmosphere */
      background-image:
        radial-gradient(120% 80% at 100% 0%, rgba(31,82,64,.06), transparent 60%),
        repeating-radial-gradient(circle at 18% -10%, transparent 0 22px, rgba(28,38,34,.025) 22px 23px);
      border-right: 1px solid var(--line-2);
      display: flex;
      flex-direction: column;
    }

    /* Brand header — compact: wordmark + kicker share one row */
    .brand {
      padding: 13px 24px 11px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(31,82,64,.05), transparent);
      animation: rise .5s cubic-bezier(.2,.7,.2,1) both;
      display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    }
    .brand h1 {
      font-weight: 800;
      font-size: clamp(20px, 2.4vw, 26px);
      letter-spacing: -0.025em;
      line-height: 1;
      color: var(--ink);
    }
    .brand h1 .lift { color: var(--thermal); }
    .brand .kicker {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px; font-weight: 500;
      letter-spacing: .14em; text-transform: uppercase;
      color: var(--ink-soft);
      white-space: nowrap;
      display: flex; align-items: center; gap: 6px;
    }
    .brand .kicker .glyph { color: var(--evergreen); font-size: 11px; }

    /* Controls block */
    .controls { padding: 13px 24px 3px; display: flex; flex-direction: column; gap: 9px;
      animation: rise .5s cubic-bezier(.2,.7,.2,1) .06s both; }

    /* Segmented model toggle */
    .segmented {
      position: relative;
      display: grid; grid-template-columns: 1fr 1fr;
      background: var(--panel);
      border: 1px solid var(--line-2);
      border-radius: 11px;
      padding: 4px;
      box-shadow: inset 0 1px 2px rgba(28,38,34,.04);
    }
    .segmented .indicator {
      position: absolute; top: 4px; left: 4px; bottom: 4px;
      width: calc(50% - 4px);
      background: var(--evergreen);
      border-radius: 8px;
      box-shadow: 0 2px 8px -2px rgba(22,58,45,.5);
      transition: transform .28s cubic-bezier(.5,.1,.1,1);
      z-index: 0;
    }
    .segmented:has(input[value="hrrr"]:checked) .indicator { transform: translateX(100%); }
    .segmented label {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center; gap: 1px;
      padding: 8px 4px; cursor: pointer; user-select: none;
      border-radius: 8px;
      transition: color .2s;
    }
    .segmented label .name { font-weight: 600; font-size: 14px; letter-spacing: -.01em; }
    .segmented label .res {
      font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .04em;
      color: var(--ink-soft);
    }
    .segmented input { position: absolute; opacity: 0; pointer-events: none; }
    .segmented input:checked ~ .name,
    .segmented label:has(input:checked) .name { color: #fff; }
    .segmented label:has(input:checked) .res { color: rgba(255,255,255,.72); }
    /* Stale data: make the model's age stand out (amber + bold). */
    .segmented label .res.stale { color: var(--stale); font-weight: 600; }
    .segmented label:has(input:checked) .res.stale { color: #f4b860; }

    /* Day picker — one button per available forecast day (hidden if 0/1 day) */
    .days { display: flex; gap: 6px; }
    .days:empty, .days.single { display: none; }
    .days button {
      flex: 1; min-width: 64px; cursor: pointer;
      font: 600 13px/1 'Bricolage Grotesque', system-ui, sans-serif;
      padding: 6px 8px; border-radius: 8px;
      border: 1px solid var(--line-2); background: var(--panel); color: var(--ink-soft);
      transition: background .15s, color .15s, border-color .15s;
    }
    .days button .sub { display: block; font: 500 9px/1.4 'IBM Plex Mono', monospace; opacity: .65; }
    .days button.active { background: var(--evergreen); color: #fff; border-color: var(--evergreen); }
    .days button.active .sub { opacity: .8; }

    /* Windgram panel */
    .panel { padding: 14px 24px 28px; flex: 1;
      animation: rise .5s cubic-bezier(.2,.7,.2,1) .12s both; }

    .empty {
      margin-top: 6px;
      border: 1px dashed var(--line-2);
      border-radius: 14px;
      padding: 48px 24px;
      text-align: center;
      color: var(--ink-soft);
      background: rgba(251,249,244,.5);
    }
    .empty .mark { font-size: 34px; display: block; margin-bottom: 12px; filter: grayscale(.2); opacity:.85; }
    .empty .lead { font-weight: 600; font-size: 15px; color: var(--ink); }
    .empty .hint { font-size: 13px; margin-top: 4px; }

    .micro { font: 500 9.5px/1 'IBM Plex Mono', monospace; letter-spacing: .16em;
      text-transform: uppercase; color: var(--ink-soft); }
    .site-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 7px 0 9px; }
    .site-head h2 {
      font-weight: 800; font-size: 17px; letter-spacing: -.01em; line-height: 1.1;
    }
    .site-head .coords {
      font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--ink-soft);
      white-space: nowrap; text-align: right; flex: 0 0 auto;
    }

    .wg-frame {
      border: 1px solid var(--line-2);
      border-radius: 14px;
      overflow: hidden;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .wg-frame img { width: 100%; display: block; cursor: zoom-in; }
    .no-data { padding: 40px 20px; text-align: center; color: var(--ink-soft); font-size: 14px; }

    .actions { margin-top: 12px; display: flex; align-items: center; justify-content: space-between; }
    .open-link {
      font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500;
      color: var(--evergreen); text-decoration: none;
      border-bottom: 1px solid transparent; transition: border-color .15s;
    }
    .open-link:hover { border-color: var(--evergreen); }
    .reveal { animation: wgIn .4s cubic-bezier(.2,.7,.2,1) both; }

    /* ── Map ───────────────────────────────────────────────────── */
    #map { flex: 1; height: 100%; background: #dfe6d8; }

    /* Bottom-sheet affordances + floating brand — mobile only */
    .sheet-grip, .sheet-close, .map-header { display: none; }

    /* Custom paraglider markers */
    .site-marker {
      text-align: center; line-height: 26px; font-size: 19px;
      transition: transform .12s cubic-bezier(.2,.7,.2,1);
      cursor: pointer;
      filter: drop-shadow(0 1px 1px rgba(0,0,0,.35));
    }
    .site-marker:hover { transform: scale(1.25); }
    .site-marker.selected {
      transform: scale(1.65);
      filter: drop-shadow(0 2px 3px rgba(224,102,42,.55));
    }
    /* thermal ring under the selected marker */
    .site-marker.selected::after {
      content: ""; position: absolute; left: 50%; top: 56%;
      width: 30px; height: 30px; transform: translate(-50%,-50%);
      border: 2px solid var(--thermal); border-radius: 50%;
      animation: ring 1.6s ease-out infinite;
    }
    @keyframes ring {
      0% { width: 18px; height: 18px; opacity: .8; }
      100% { width: 46px; height: 46px; opacity: 0; }
    }

    /* Leaflet chrome to match */
    .leaflet-bar a {
      background: var(--panel); color: var(--ink); border-color: var(--line-2) !important;
    }
    .leaflet-bar a:hover { background: #fff; }
    .leaflet-tooltip {
      font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500;
      background: var(--evergreen-d); color: #fff; border: none; box-shadow: var(--shadow);
      padding: 3px 8px; border-radius: 6px;
    }
    .leaflet-tooltip-top::before { border-top-color: var(--evergreen-d); }
    .leaflet-container { font-family: 'IBM Plex Mono', monospace; }

    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes wgIn { from { opacity: 0; transform: translateY(8px) scale(.99); } to { opacity: 1; transform: none; } }

    /* ── Mobile: stack, give the map a small fixed share ───────── */
    @media (max-width: 720px) {
      /* Full-screen map; the forecast slides up as a dismissible bottom sheet. */
      html, body { height: 100%; }
      #app { display: block; height: 100dvh; }
      #map { position: absolute; inset: 0; width: 100%; height: 100dvh; }

      /* Persistent bottom bar: model/date selectors always docked at the bottom;
         the windgram (.panel) collapses and slides up to reveal on selection. */
      #sidebar {
        position: fixed; left: 0; right: 0; bottom: 0;
        width: 100%; min-width: 0; max-width: none; height: auto;
        max-height: 88dvh;
        border: 1px solid var(--line-2); border-bottom: none;
        border-radius: 18px 18px 0 0;
        box-shadow: 0 -10px 34px rgba(28,38,34,.22);
        z-index: 1000;
        overflow-y: auto; overscroll-behavior: contain;
      }

      .sheet-grip {
        display: block; width: 40px; height: 4px; border-radius: 3px;
        background: var(--line-2); margin: 9px auto 2px; cursor: pointer;
      }
      /* The ✕ only appears once expanded — it collapses back to the selector peek. */
      .sheet-close {
        display: none; align-items: center; justify-content: center;
        position: absolute; top: 10px; right: 12px; width: 30px; height: 30px;
        border: none; border-radius: 50%; background: var(--panel);
        color: var(--ink-soft); font-size: 13px; cursor: pointer;
        box-shadow: 0 1px 3px rgba(28,38,34,.18); z-index: 2;
      }
      #sidebar.open .sheet-close { display: flex; }
      .brand { display: none; }
      .controls { padding: 4px 18px 6px; }
      /* Collapsed by default (peek shows only the selectors); slides open on select. */
      .panel { max-height: 0; overflow: hidden; padding: 0 18px; opacity: 0;
        transition: max-height .34s cubic-bezier(.2,.7,.2,1), opacity .24s, padding .34s; }
      #sidebar.open .panel { max-height: 72dvh; opacity: 1; padding: 4px 18px 30px; }

      /* Floating brand pill over the map */
      .map-header {
        display: flex; flex-direction: column; gap: 1px;
        position: fixed; top: 10px; left: 10px; z-index: 500;
        padding: 7px 12px; border-radius: 12px;
        background: rgba(243,239,230,.92); backdrop-filter: blur(3px);
        border: 1px solid var(--line); box-shadow: var(--shadow);
        pointer-events: none;
      }
      .map-header h1 { font-weight: 800; font-size: 17px; letter-spacing: -.02em;
        line-height: 1; color: var(--ink); }
      .map-header h1 .lift { color: var(--thermal); }
      .map-header .kicker { font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); text-align: right; }
      .map-header .glyph { color: var(--evergreen); }
      /* Pill is click-through (pointer-events:none) so the map stays draggable;
         re-enable just the v2 link so it's tappable. */
      .map-header a { pointer-events: auto; display: inline-block; padding: 1px 0;
        font-weight: 600; color: var(--thermal); text-decoration: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sheet-grip" id="sheetGrip" aria-hidden="true"></div>
      <button class="sheet-close" id="sheetClose" aria-label="Close forecast">✕</button>
      <header class="brand">
        <div class="wordmark">
          <h1>PNW <span class="lift">Soaring</span></h1>
        </div>
        <div class="kicker"><span class="glyph">▲</span> Cascades · thermal forecast · <a href="/v2" style="color:var(--thermal);text-decoration:none">try v2 →</a></div>
      </header>

      <div class="controls">
        <div class="segmented" role="radiogroup" aria-label="Forecast model">
          <span class="indicator" aria-hidden="true"></span>
          <label>
            <input type="radio" name="model" value="nam" checked>
            <span class="name">NAM</span><span class="res" data-model="nam" data-res="1.3 km">1.3 km</span>
          </label>
          <label>
            <input type="radio" name="model" value="hrrr">
            <span class="name">HRRR</span><span class="res" data-model="hrrr" data-res="1 km">1 km</span>
          </label>
        </div>
        <div class="days single" id="days" role="group" aria-label="Forecast day"></div>
      </div>

      <section class="panel">
        <div class="empty" id="windgram-empty">
          <span class="mark">🪂</span>
          <div class="lead">Pick a launch on the map</div>
          <div class="hint">Tap a site to read its thermal &amp; wind forecast.</div>
        </div>

        <div id="windgram-content" style="display:none">
          <div class="micro">Windgram</div>
          <div class="site-head">
            <h2 id="site-name"></h2>
            <span class="coords" id="site-coords"></span>
          </div>
          <a class="wg-frame" id="windgram-link" href="#" target="_blank" rel="noopener">
            <img id="windgram-img" alt="" />
          </a>
          <div class="no-data" id="windgram-nodata" style="display:none"></div>
          <div class="actions">
            <a class="open-link" id="open-full" href="#" target="_blank" rel="noopener">Open full size ↗</a>
          </div>
        </div>
      </section>
    </aside>

    <div id="map"></div>
    <!-- Floating brand over the full-screen map (mobile only) -->
    <div class="map-header">
      <h1>PNW <span class="lift">Soaring</span></h1>
      <span class="kicker"><a href="/v2">try v2 →</a></span>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { zoomControl: false }).setView([47.55, -121.80], 11);
    L.control.zoom({ position: 'topright' }).addTo(map);   // clear of the brand pill

    L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
      maxZoom: 17,
      attribution: '&copy; OpenTopoMap (CC-BY-SA)'
    }).addTo(map);

    // Site names arrive snake_case (Poo_Poo_Point) or smushed CamelCase
    // (TigerHikeLookout, MtSi). Render both as spaced words.
    function prettyName(name) {
      return name
        .replace(/_/g, ' ')
        .replace(/([a-z0-9])([A-Z])/g, '$1 $2')
        .replace(/\s+/g, ' ')
        .trim();
    }

    const DEFAULT_SITE = 'Poo_Poo_Point';   // auto-selected on load
    let currentModel = 'nam';        // NAM default — timelier + carries the 2-day window
    let currentSite = null;
    let currentDate = null;          // selected forecast day (null → forecasts/latest)
    let selectedMarker = null;
    let markers = [];
    let metadata = {};
    const availableDays = {};        // model -> [{date, off, label, sub}]

    async function loadSites() {
      try {
        const sites = await (await fetch('sites.json')).json();
        updateMarkers(sites);
      } catch (e) { console.error('Failed to load sites:', e); }
    }

    async function loadMetadata() {
      for (const model of ['nam', 'hrrr']) {
        try {
          const resp = await fetch(`forecasts/latest/${model}/metadata.json`);
          if (resp.ok) metadata[model] = await resp.json();
        } catch (e) {}
      }
      renderToggleMeta();
    }

    function timeAgo(d) {
      const h = (Date.now() - d.getTime()) / 3.6e6;
      if (h < 1) return `${Math.round(h * 60)}m ago`;
      if (h < 24) return `${Math.round(h)}h ago`;
      return `${Math.round(h / 24)}d ago`;
    }

    // Each toggle option shows that model's resolution + when it last ran,
    // and flags the age (amber + bold) when the data is stale (>12h old).
    function renderToggleMeta() {
      document.querySelectorAll('.res[data-model]').forEach(el => {
        const m = metadata[el.dataset.model];
        if (!m) { el.textContent = el.dataset.res; el.classList.remove('stale'); return; }
        const updated = new Date(m.generated);
        const stale = (Date.now() - updated.getTime()) / 3.6e6 > 12;
        el.textContent = `${el.dataset.res} · ${timeAgo(updated)}`;
        el.classList.toggle('stale', stale);
      });
    }

    // ── Day picker — probe which forecast days exist for a model ──────────
    function dayLabel(off, dateStr) {
      if (off === 0) return 'Today';
      if (off === 1) return 'Tomorrow';
      return new Date(dateStr + 'T12:00:00Z').toLocaleDateString(undefined, { weekday: 'short' });
    }
    async function discoverDays(model) {
      if (availableDays[model]) return availableDays[model];
      // Anchor "today" to the forecast's zone (America/Los_Angeles), NOT the
      // browser's UTC date. In the evening, UTC has already rolled to the next
      // day while PDT hasn't — so a UTC-based off=0 mislabels *tomorrow's*
      // forecast as "Today" (and shifts the whole picker a day). en-CA gives a
      // YYYY-MM-DD string; DST is handled by the timeZone option.
      const [by, bm, bd] = new Date()
        .toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' })
        .split('-').map(Number);
      const out = [];
      for (let off = 0; off <= 2; off++) {
        const d = new Date(Date.UTC(by, bm - 1, bd + off));
        const ds = d.toISOString().slice(0, 10);
        // Skip a day once its soaring window (~8pm local, PDT) has ended — so an
        // evening visit shows "tomorrow + next-day", not a spent "today". This is
        // what makes the night-before case read correctly.
        if (Date.now() > Date.parse(ds + 'T20:00:00-07:00')) continue;
        try {
          const r = await fetch(`forecasts/${ds}/${model}/metadata.json`, { cache: 'no-cache' });
          if (r.ok) out.push({ date: ds, off, label: dayLabel(off, ds), sub: ds.slice(5) });
        } catch (e) {}
      }
      availableDays[model] = out;
      return out;
    }
    function renderDays(days) {
      const el = document.getElementById('days');
      el.innerHTML = '';
      el.classList.toggle('single', days.length < 2);    // hide the picker if only one day
      days.forEach(d => {
        const b = document.createElement('button');
        b.innerHTML = `${d.label}<span class="sub">${d.sub}</span>`;
        b.classList.toggle('active', d.date === currentDate);
        b.onclick = () => { currentDate = d.date; renderDays(days); updateWindgram(); };
        el.appendChild(b);
      });
    }
    async function loadDays() {
      const days = await discoverDays(currentModel);
      if (!days.find(d => d.date === currentDate)) currentDate = days.length ? days[0].date : null;
      renderDays(days);
    }

    function updateWindgram() {
      const empty = document.getElementById('windgram-empty');
      const content = document.getElementById('windgram-content');
      if (!currentSite) { empty.style.display = ''; content.style.display = 'none'; return; }
      empty.style.display = 'none';
      content.style.display = '';
      content.classList.remove('reveal'); void content.offsetWidth; content.classList.add('reveal');

      const img = document.getElementById('windgram-img');
      const nodata = document.getElementById('windgram-nodata');
      const link = document.getElementById('windgram-link');
      const openFull = document.getElementById('open-full');
      const base = currentDate ? `forecasts/${currentDate}/${currentModel}`
                               : `forecasts/latest/${currentModel}`;
      const src = `${base}/${currentSite.name}_windgram.png`;

      document.getElementById('site-name').textContent = prettyName(currentSite.name);
      document.getElementById('site-coords').textContent =
        `${currentSite.lat.toFixed(4)}, ${currentSite.lon.toFixed(4)}`;
      nodata.textContent = `No ${currentModel.toUpperCase()} forecast for this site yet.`;
      nodata.style.display = 'none';
      img.style.display = '';
      img.alt = `${prettyName(currentSite.name)} windgram`;
      img.onerror = () => { img.style.display = 'none'; nodata.style.display = ''; };
      img.src = src;
      link.href = src; openFull.href = src;
    }

    const sheet = document.getElementById('sidebar');
    const openSheet  = () => sheet.classList.add('open');     // no-op on desktop (CSS)
    const closeSheet = () => sheet.classList.remove('open');

    function selectSite(site, marker) {
      currentSite = site;
      if (selectedMarker && selectedMarker._icon) selectedMarker._icon.classList.remove('selected');
      selectedMarker = marker;
      if (marker && marker._icon) marker._icon.classList.add('selected');
      updateWindgram();
    }

    function updateMarkers(sites) {
      markers.forEach(m => map.removeLayer(m));
      markers = [];
      const icon = L.divIcon({ html: '🪂', className: 'site-marker', iconSize: [26, 26], iconAnchor: [13, 13] });
      let dflt = null;
      sites.forEach(site => {
        const label = prettyName(site.name);
        const marker = L.marker([site.lat, site.lon], { icon, title: label }).addTo(map);
        marker.bindTooltip(label, { direction: 'top', offset: [0, -12] });
        marker.on('click', () => { selectSite(site, marker); openSheet(); });
        markers.push(marker);
        if (site.name === DEFAULT_SITE) dflt = { site, marker };
      });
      // Pre-select the default site (renders the windgram) but leave the sheet
      // closed on mobile — the map opens full-screen; tapping a site reveals it.
      if (dflt && !currentSite) selectSite(dflt.site, dflt.marker);
    }

    document.querySelectorAll('input[name="model"]').forEach(r => {
      r.addEventListener('change', async e => {
        currentModel = e.target.value;
        await loadDays();          // each model may offer a different set of days
        updateWindgram();
      });
    });

    // Dismiss the sheet: close button, grip tap, or tapping the open map.
    document.getElementById('sheetClose').addEventListener('click', closeSheet);
    // Grip toggles the windgram open/closed; selectors stay docked either way.
    document.getElementById('sheetGrip').addEventListener('click', () => sheet.classList.toggle('open'));
    map.on('click', closeSheet);   // empty-map taps (marker clicks don't propagate)

    // Resolve the day set first (sets currentDate), then sites + metadata.
    (async () => {
      await loadDays();
      loadSites();
      loadMetadata();
      setTimeout(() => map.invalidateSize(), 0);
    })();
  </script>
</body>
</html>
