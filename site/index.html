<!DOCTYPE html>
<html>
<head>
  <title>PNW Soaring Forecasts</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

    #app { display: flex; height: 100vh; }

    /* Left sidebar holds the controls + the selected site's windgram */
    #sidebar {
      flex: 0 0 420px;
      max-width: 420px;
      height: 100%;
      overflow-y: auto;
      background: #fff;
      border-right: 1px solid #ddd;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #map { flex: 1; height: 100%; }

    .title { font-weight: 600; font-size: 18px; }
    .model-toggle label { margin-right: 14px; cursor: pointer; font-size: 14px; }
    .meta { font-size: 12px; color: #666; }
    .meta.stale { color: #b8860b; }

    .windgram-panel { margin-top: 4px; }
    .windgram-panel h3 { font-size: 16px; margin-bottom: 6px; }
    .windgram-panel img {
      width: 100%; border-radius: 4px; border: 1px solid #ddd; cursor: zoom-in;
      display: block;
    }
    .windgram-panel .empty {
      color: #999; font-size: 14px; text-align: center;
      padding: 40px 16px; border: 1px dashed #ddd; border-radius: 8px;
    }
    .windgram-panel .no-data { color: #999; padding: 24px 0; text-align: center; }
    .windgram-panel .open-link {
      display: inline-block; margin-top: 8px; font-size: 12px;
      color: #0066cc; text-decoration: none;
    }
    .windgram-panel .open-link:hover { text-decoration: underline; }

    /* Marker emphasis for the currently selected site */
    .site-marker { transition: transform 0.1s; text-align: center; line-height: 24px; }
    .site-marker.selected { transform: scale(1.5); filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5)); }

    /* Stack on narrow screens so it isn't a desktop-only layout */
    @media (max-width: 720px) {
      #app { flex-direction: column; }
      #sidebar { flex: 0 0 auto; max-width: none; width: 100%; max-height: 50vh; border-right: none; border-bottom: 1px solid #ddd; }
      #map { flex: 1 1 auto; min-height: 0; }
    }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="title">PNW Soaring Forecast</div>
      <div class="model-toggle">
        <label><input type="radio" name="model" value="hrrr" checked> HRRR (1km)</label>
        <label><input type="radio" name="model" value="nam"> NAM (1.3km)</label>
      </div>
      <div class="meta" id="meta"></div>

      <div class="windgram-panel">
        <div class="empty" id="windgram-empty">Select a site on the map to see its forecast.</div>
        <div id="windgram-content" style="display:none">
          <h3 id="site-name"></h3>
          <a id="windgram-link" href="#" target="_blank">
            <img id="windgram-img" alt="" />
          </a>
          <div class="no-data" id="windgram-nodata" style="display:none"></div>
          <div><a class="open-link" id="open-full" href="#" target="_blank">Open full size ↗</a></div>
        </div>
      </div>
    </aside>

    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([47.50, -121.85], 12);

    L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
      maxZoom: 17,
      attribution: '&copy; OpenTopoMap'
    }).addTo(map);

    let currentModel = 'hrrr';
    let currentSite = null;      // {name, lat, lon}
    let selectedMarker = null;
    let markers = [];
    let metadata = {};

    async function loadSites() {
      try {
        const resp = await fetch('sites.json');
        const sites = await resp.json();
        updateMarkers(sites);
      } catch (e) {
        console.error('Failed to load sites:', e);
      }
    }

    async function loadMetadata() {
      for (const model of ['nam', 'hrrr']) {
        try {
          const resp = await fetch(`forecasts/latest/${model}/metadata.json`);
          if (resp.ok) metadata[model] = await resp.json();
        } catch (e) {}
      }
      updateMeta();
    }

    function updateMeta() {
      const m = metadata[currentModel];
      const el = document.getElementById('meta');
      if (m) {
        const updated = new Date(m.generated);
        const ageH = (Date.now() - updated.getTime()) / 3.6e6;
        el.textContent = `${m.model.toUpperCase()} ${m.date} — updated ${updated.toLocaleString()}`;
        el.classList.toggle('stale', ageH > 12);
      } else {
        el.textContent = 'No forecast data yet';
        el.classList.remove('stale');
      }
    }

    function updateWindgram() {
      const empty = document.getElementById('windgram-empty');
      const content = document.getElementById('windgram-content');
      if (!currentSite) {
        empty.style.display = '';
        content.style.display = 'none';
        return;
      }
      empty.style.display = 'none';
      content.style.display = '';

      const img = document.getElementById('windgram-img');
      const nodata = document.getElementById('windgram-nodata');
      const link = document.getElementById('windgram-link');
      const openFull = document.getElementById('open-full');
      const src = `forecasts/latest/${currentModel}/${currentSite.name}_windgram.png`;

      document.getElementById('site-name').textContent = currentSite.name.replace(/_/g, ' ');
      nodata.textContent = `No ${currentModel.toUpperCase()} forecast available for this site.`;
      nodata.style.display = 'none';
      img.style.display = '';
      img.alt = currentSite.name;
      img.onerror = () => { img.style.display = 'none'; nodata.style.display = ''; };
      img.src = src;
      link.href = src;
      openFull.href = src;
    }

    function selectSite(site, marker) {
      currentSite = site;
      if (selectedMarker && selectedMarker._icon) selectedMarker._icon.classList.remove('selected');
      selectedMarker = marker;
      if (marker && marker._icon) marker._icon.classList.add('selected');
      updateWindgram();
    }

    function updateMarkers(sites) {
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      const icon = L.divIcon({
        html: '🪂',
        className: 'site-marker',
        iconSize: [24, 24],
        iconAnchor: [12, 12],
      });

      sites.forEach(site => {
        const marker = L.marker([site.lat, site.lon], { icon, title: site.name.replace(/_/g, ' ') }).addTo(map);
        marker.bindTooltip(site.name.replace(/_/g, ' '), { direction: 'top', offset: [0, -10] });
        marker.on('click', () => selectSite(site, marker));
        markers.push(marker);
      });
    }

    document.querySelectorAll('input[name="model"]').forEach(r => {
      r.addEventListener('change', e => {
        currentModel = e.target.value;
        updateMeta();
        updateWindgram();
      });
    });

    loadSites();
    loadMetadata();
    // Map shares the viewport with the sidebar; make sure Leaflet measures correctly.
    setTimeout(() => map.invalidateSize(), 0);
  </script>
</body>
</html>
