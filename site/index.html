<!DOCTYPE html>
<html>
<head>
  <title>PNW Soaring Forecasts</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    #map { width: 100%; height: 100vh; }
    .controls {
      position: absolute; top: 10px; right: 10px; z-index: 1000;
      background: white; padding: 10px 14px; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      font-size: 14px;
    }
    .controls label { margin-right: 12px; cursor: pointer; }
    .controls .title { font-weight: 600; margin-bottom: 6px; font-size: 15px; }
    .controls .meta { font-size: 11px; color: #666; margin-top: 6px; }
    .windgram-popup { text-align: center; }
    .windgram-popup img {
      max-width: 700px; width: 100%;
      border-radius: 4px; border: 1px solid #ddd;
      cursor: pointer;
    }
    .windgram-popup h3 { margin: 0 0 4px 0; font-size: 16px; }
    .windgram-popup .open-link {
      display: inline-block; margin-top: 6px; font-size: 12px;
      color: #0066cc; text-decoration: none;
    }
    .windgram-popup .open-link:hover { text-decoration: underline; }
    .windgram-popup .no-data { color: #999; padding: 20px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="controls">
    <div class="title">PNW Soaring Forecast</div>
    <label><input type="radio" name="model" value="hrrr" checked> HRRR (3km)</label>
    <label><input type="radio" name="model" value="hrrr-1km"> HRRR (1km)</label>
    <label><input type="radio" name="model" value="nam"> NAM (1.3km)</label>
    <div class="meta" id="meta"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([47.50, -121.85], 12);

    L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
      maxZoom: 17,
      attribution: '&copy; OpenTopoMap'
    }).addTo(map);

    let currentModel = 'hrrr';
    let markers = [];
    let metadata = {};

    async function loadSites() {
      try {
        const resp = await fetch('sites.json');
        const sites = await resp.json();
        updateMarkers(sites);
      } catch (e) {
        console.error('Failed to load sites:', e);
      }
    }

    async function loadMetadata() {
      for (const model of ['nam', 'hrrr', 'hrrr-1km']) {
        try {
          const resp = await fetch(`forecasts/latest/${model}/metadata.json`);
          if (resp.ok) metadata[model] = await resp.json();
        } catch (e) {}
      }
      updateMeta();
    }

    function updateMeta() {
      const m = metadata[currentModel];
      const el = document.getElementById('meta');
      if (m) {
        el.textContent = `${m.model.toUpperCase()} ${m.date} — updated ${new Date(m.generated).toLocaleString()}`;
      } else {
        el.textContent = 'No forecast data yet';
      }
    }

    function updateMarkers(sites) {
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      const icon = L.divIcon({
        html: '🪂',
        className: 'site-marker',
        iconSize: [24, 24],
        iconAnchor: [12, 12],
      });

      sites.forEach(site => {
        const marker = L.marker([site.lat, site.lon], { icon, title: site.name }).addTo(map);
        marker.bindPopup(() => {
          const img = `forecasts/latest/${currentModel}/${site.name}_windgram.png`;
          return `<div class="windgram-popup">
            <h3>${site.name}</h3>
            <a href="${img}" target="_blank">
              <img src="${img}" alt="${site.name}"
                   onerror="this.style.display='none'; this.closest('.windgram-popup').querySelector('.no-data').style.display='block'" />
            </a>
            <div class="no-data" style="display:none">No ${currentModel.toUpperCase()} forecast available</div>
            <a class="open-link" href="${img}" target="_blank">Open full size ↗</a>
          </div>`;
        }, { maxWidth: 750, minWidth: 400 });
        markers.push(marker);
      });
    }

    document.querySelectorAll('input[name="model"]').forEach(r => {
      r.addEventListener('change', e => {
        currentModel = e.target.value;
        updateMeta();
        // Update the image in any open popup without closing it
        const popup = document.querySelector('.windgram-popup');
        if (popup) {
          const img = popup.querySelector('img');
          const link = popup.querySelector('a');
          const openLink = popup.querySelector('.open-link');
          const noData = popup.querySelector('.no-data');
          if (img) {
            const site = popup.querySelector('h3').textContent;
            const newSrc = `forecasts/latest/${currentModel}/${site}_windgram.png`;
            img.style.display = '';
            noData.style.display = 'none';
            img.src = newSrc;
            if (link) link.href = newSrc;
            if (openLink) openLink.href = newSrc;
          }
        }
      });
    });

    loadSites();
    loadMetadata();
  </script>
</body>
</html>
