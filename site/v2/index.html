<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PNW Soaring — v2 (beta)</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"/>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2622; --ink-soft:#566159; --paper:#f1ece1; --panel:#fbf9f4;
    --evergreen:#1f5240; --thermal:#e0662a; --line:rgba(28,38,34,.12);
    --glass:rgba(248,245,238,.80);
    --shadow:0 6px 24px -8px rgba(28,38,34,.45); --shadow-sm:0 2px 10px -3px rgba(28,38,34,.3);
    --r:13px; --r-sm:8px;
  }
  *{margin:0;box-sizing:border-box} html,body{height:100%}
  body{font-family:'Bricolage Grotesque',system-ui,sans-serif;color:var(--ink);background:var(--paper)}
  #wrap{display:flex;height:100dvh}
  #left{flex:1;position:relative}
  #map{position:absolute;inset:0}
  .maplibregl-ctrl-attrib-inner,.maplibregl-ctrl-attrib{font-family:'IBM Plex Mono',monospace;font-size:10px}

  .micro{font:500 9.5px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;
    text-transform:uppercase;color:var(--ink-soft)}

  /* ── Floating instrument cards over the map ───────────────────────── */
  .bar{position:absolute;top:12px;right:12px;z-index:2;width:180px;
    background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 11px 10px;box-shadow:var(--shadow-sm)}
  .bar .val{display:block;font-weight:700;font-size:13px;letter-spacing:-.01em;margin:2px 0 7px}
  #tslider{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:3px;
    background:linear-gradient(90deg,var(--evergreen),#caa12a,var(--thermal));outline:none;cursor:pointer}
  #tslider::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;
    background:#fff;border:2.5px solid var(--evergreen);box-shadow:0 1px 5px rgba(0,0,0,.35);cursor:grab}
  #tslider::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:#fff;
    border:2.5px solid var(--evergreen);box-shadow:0 1px 5px rgba(0,0,0,.35);cursor:grab}
  #tslider:active::-webkit-slider-thumb{cursor:grabbing}

  /* TOL legend — same instrument card; color bar at the overlay's opacity */
  .legend{position:absolute;right:12px;top:50%;transform:translateY(-50%);z-index:1;pointer-events:none;
    background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 10px;box-shadow:var(--shadow-sm)}
  .legend-title{margin-bottom:7px}
  .legend-body{display:flex;gap:7px}
  .legend-bar{width:11px;height:clamp(150px,32vh,260px);border-radius:4px;opacity:.6;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.16)}
  .legend-ticks{position:relative;width:32px;font:500 9.5px/1 'IBM Plex Mono',monospace;color:var(--ink-soft)}
  .legend-ticks span{position:absolute;transform:translateY(-50%);white-space:nowrap}

  /* cursor-following Top-of-lift readout */
  .tolhover{position:absolute;z-index:3;pointer-events:none;display:none;
    background:rgba(28,38,34,.92);color:#fff;padding:4px 9px;border-radius:7px;
    font:600 11.5px 'IBM Plex Mono',monospace;box-shadow:0 2px 9px rgba(0,0,0,.35);
    transform:translate(14px,-50%);white-space:nowrap}
  .tolhover::before{content:"TOL ";font-weight:500;font-size:9px;letter-spacing:.12em;opacity:.55}

  /* ── Launch / landing site markers ──────────────────────────────────── */
  /* NB: never put transform/transition on .ll-marker itself — MapLibre owns its
     transform for geo-positioning; overriding it makes the pins drift on pan/zoom. */
  .ll-marker{position:relative;width:26px;height:26px;cursor:pointer}
  .ll-marker:hover{z-index:6}
  .ll-ico{display:flex;align-items:center;justify-content:center;width:26px;height:26px;
    border-radius:50% 50% 50% 2px;transform:rotate(45deg);transform-origin:center;
    transition:transform .12s;border:2px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,.42)}
  .ll-marker:hover .ll-ico{transform:rotate(45deg) scale(1.16)}
  .ll-ico svg{width:15px;height:15px;display:block;transform:rotate(-45deg)}
  .ll-marker.launch  .ll-ico{background:var(--evergreen)}
  .ll-marker.landing .ll-ico{background:#2f6f93}
  .ll-name{position:absolute;left:32px;top:3px;white-space:nowrap;
    font:600 11px 'IBM Plex Mono',monospace;color:var(--ink);
    background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    padding:2px 7px;border-radius:6px;border:1px solid var(--line);box-shadow:var(--shadow-sm);
    opacity:0;pointer-events:none;transition:opacity .12s}
  .ll-marker:hover .ll-name{opacity:1}

  /* ── Left sidebar (matches v1: left side, flex 0 0 40%, 380–640px) ───── */
  #panel{order:-1;flex:0 0 40%;min-width:380px;max-width:640px;border-right:1px solid var(--line);overflow:auto;
    padding:24px 24px 30px;
    background:linear-gradient(180deg,#f5f0e6,var(--paper) 240px)}
  #panel>*{animation:rise .5s both}
  #panel>*:nth-child(2){animation-delay:.05s} #panel>*:nth-child(3){animation-delay:.1s}
  #panel>*:nth-child(4){animation-delay:.15s} #panel>*:nth-child(5){animation-delay:.2s}
  @keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  .bar,.legend{animation:rise .55s both .12s}

  .brand{display:flex;align-items:baseline;gap:9px}
  .brand h1{font-weight:800;font-size:24px;letter-spacing:-.025em;line-height:1}
  .brand .lift{color:var(--thermal)}
  .beta{font:600 9px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;
    color:#fff;background:var(--thermal);padding:3px 6px;border-radius:5px}
  .kick{font:500 11px/1.4 'IBM Plex Mono',monospace;color:var(--ink-soft);
    margin:8px 0 16px;padding-bottom:16px;border-bottom:1px solid var(--line)}
  .kick a{color:var(--evergreen);text-decoration:none;border-bottom:1px solid rgba(31,82,64,.35)}
  .kick a:hover{border-bottom-color:var(--evergreen)}

  /* Segmented model toggle — matches v1: stacked name + resolution, sliding indicator */
  .segmented{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--panel);
    border:1px solid var(--line);border-radius:11px;padding:4px;margin-bottom:14px;
    box-shadow:inset 0 1px 2px rgba(28,38,34,.04)}
  .segmented .indicator{position:absolute;top:4px;left:4px;bottom:4px;width:calc(50% - 4px);
    background:var(--evergreen);border-radius:8px;box-shadow:0 2px 8px -2px rgba(22,58,45,.5);
    transition:transform .28s cubic-bezier(.5,.1,.1,1);z-index:0}
  .segmented:has(input[value="hrrr"]:checked) .indicator{transform:translateX(100%)}
  .segmented label{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:1px;
    padding:8px 4px;cursor:pointer;user-select:none;border-radius:8px;transition:color .2s}
  .segmented label .name{font-weight:700;font-size:14px;letter-spacing:-.01em}
  .segmented label .res{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.04em;color:var(--ink-soft)}
  .segmented input{position:absolute;opacity:0;pointer-events:none}
  .segmented label:has(input:checked) .name{color:#fff}
  .segmented label:has(input:checked) .res{color:rgba(255,255,255,.72)}
  /* Day picker — one button per available forecast day (hidden if 0/1 day) */
  .days{display:flex;gap:6px;margin:-4px 0 14px}
  .days:empty,.days.single{display:none}
  .days button{flex:1;min-width:64px;cursor:pointer;font:700 13px/1 'Bricolage Grotesque',system-ui,sans-serif;
    padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);
    transition:background .15s,color .15s,border-color .15s}
  .days button:hover:not(.active){background:rgba(28,38,34,.05)}
  .days button .sub{display:block;font:500 9px/1.4 'IBM Plex Mono',monospace;opacity:.65;margin-top:1px}
  .days button.active{background:var(--evergreen);color:#fff;border-color:var(--evergreen)}
  .days button.active .sub{opacity:.85}
  /* Unavailable model (cube not published) — dim + not clickable */
  .segmented label.disabled{cursor:not-allowed;opacity:.45}
  .segmented label.disabled .res{color:var(--thermal);font-weight:600}

  #wgwrap{margin-top:2px}
  .wg-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:9px 0 7px}
  .site-name{font-weight:800;font-size:17px;letter-spacing:-.01em}
  .coords{font:500 10.5px 'IBM Plex Mono',monospace;color:var(--ink-soft);text-align:right;flex:0 0 auto}
  #wg{width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;box-shadow:var(--shadow-sm)}

  .note{font:500 12px/1.5 'IBM Plex Mono',monospace;background:#fff7ec;
    border:1px solid #f0d9b8;border-radius:10px;padding:11px 13px;margin-top:2px;color:#9a6212}
  .hint{font:500 12.5px/1.55 'Bricolage Grotesque',sans-serif;color:var(--ink-soft);margin-top:16px;
    padding:12px 14px;background:rgba(31,82,64,.05);border:1px dashed var(--line);border-radius:10px}
</style>
</head>
<body>
<div id="wrap">
  <div id="left">
    <div id="map"></div>
    <div class="bar">
      <span class="micro">Top of lift</span>
      <span class="val" id="tlabel">—</span>
      <input id="tslider" type="range" min="0" max="0" value="0">
    </div>
    <div class="legend" id="legend" style="display:none">
      <div class="legend-title micro">Top of lift</div>
      <div class="legend-body">
        <div class="legend-bar" id="legendBar"></div>
        <div class="legend-ticks" id="legendTicks"></div>
      </div>
    </div>
    <div class="tolhover" id="tolhover"></div>
  </div>
  <div id="panel">
    <div class="brand"><h1>PNW <span class="lift">Soaring</span></h1><span class="beta">v2 beta</span></div>
    <div class="kick">Interactive cube · <a href="/">← back to v1</a></div>
    <div class="segmented" role="radiogroup" aria-label="Forecast model">
      <span class="indicator" aria-hidden="true"></span>
      <label>
        <input type="radio" name="model" value="nam" checked>
        <span class="name">NAM</span><span class="res" data-model="nam" data-res="1.3 km">1.3 km</span>
      </label>
      <label id="hrrr-opt">
        <input type="radio" name="model" value="hrrr">
        <span class="name">HRRR</span><span class="res" data-model="hrrr" data-res="1 km">1 km</span>
      </label>
    </div>
    <div class="days" id="days"></div>
    <div id="status"></div>
    <div id="wgwrap" style="display:none">
      <div class="micro">Windgram</div>
      <div class="wg-head">
        <span class="site-name" id="site-name"></span>
        <span class="coords" id="coords"></span>
      </div>
      <canvas id="wg" width="540" height="430"></canvas>
    </div>
    <div class="hint" id="hint" style="display:none">Click anywhere on the map for a windgram — generated in your browser from the forecast cube.</div>
  </div>
</div>

<script type="module">
import * as zarr from "https://esm.sh/zarrita@0.4.0";
import { renderWindgram } from "./windgram.js";   // faithful TS port of rasp-windgram/windgram.py (built from windgram-ts/)
const maplibregl = window.maplibregl;

// Cube hosting: Cloudflare R2 (per-model "latest"). Override for testing with ?cube=<base>.
const CUBE_BASE = new URLSearchParams(location.search).get("cube")
  || "https://pub-de96e47b1e91464bb2959747602c1914.r2.dev";   // R2 public (r2.dev) bucket: nw-paragliding-forecasts
const cubeUrl = (m, d) => `${CUBE_BASE}/${m}/${d || "latest"}/soaring.zarr`;
const TOL_CMAP = ["#3a4fa0","#2f7fb0","#5fa84a","#e6c34a","#d97b34","#9e3b2e"];
const TOL_CLIM = [1500, 10500];   // ft ASL — overlay color limits + legend range

// Basemap: the DEM + labels combo from glide-range — OpenFreeMap Positron base,
// an AWS terrarium hillshade for terrain relief, and peak/water labels pulled
// from the OpenMapTiles vector source on top.
const map = new maplibregl.Map({ container:"map",
  style:"https://tiles.openfreemap.org/styles/positron",
  center:[-121.86,47.46], zoom:10.4 });   // framed on the Tiger / Rattlesnake cluster

let model="nam", goodModel="nam", currentDate=null, daysCache={}, cube=null, zlayer=null, tIdx=6, beforeLabelId;   // default ~2pm local (peak thermals)

function setupBasemap(){
  // Keep our raster layers under the style's labels so place names stay legible.
  const firstSymbol = map.getStyle().layers.find(l=>l.type==="symbol");
  beforeLabelId = firstSymbol ? firstSymbol.id : undefined;

  map.addSource("terrain-dem", { type:"raster-dem",
    tiles:["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"],
    encoding:"terrarium", tileSize:256, maxzoom:15,
    attribution:'Terrain © <a href="https://registry.opendata.aws/terrain-tiles/">AWS Terrain Tiles</a>' });
  map.addLayer({ id:"hillshade", type:"hillshade", source:"terrain-dem", paint:{
    "hillshade-exaggeration":0.55, "hillshade-shadow-color":"#4a3e28",
    "hillshade-highlight-color":"#ffffff", "hillshade-accent-color":"#000000",
    "hillshade-illumination-direction":335 } }, beforeLabelId);

  // Extra peak + water-name labels from the OpenMapTiles source (Positron is
  // sparse with these). Added on top so they read over the TOL overlay.
  if(map.getSource("openmaptiles")){
    const sym = map.getStyle().layers.find(l=>l.type==="symbol" && l.layout && l.layout["text-font"]);
    const fontStack = sym ? sym.layout["text-font"] : ["Noto Sans Regular"];
    map.addLayer({ id:"peak-labels", type:"symbol", source:"openmaptiles",
      "source-layer":"mountain_peak", minzoom:7, filter:["has","name"], layout:{
        "text-field":["concat",["coalesce",["get","name_en"],["get","name"],""],
          ["case",["has","ele"],["concat","\n",["to-string",["get","ele"]]," m"],""]],
        "text-font":fontStack, "text-size":["interpolate",["linear"],["zoom"],8,10,14,13],
        "text-anchor":"top", "text-offset":[0,0.3], "text-max-width":8,
        "symbol-sort-key":["-",10000,["coalesce",["get","ele"],0]] },
      paint:{ "text-color":"#3c2f14", "text-halo-color":"#ffffff", "text-halo-width":1.5 } });
    map.addLayer({ id:"water-name-labels", type:"symbol", source:"openmaptiles",
      "source-layer":"water_name", minzoom:7,
      filter:["all",["has","name"],["==",["geometry-type"],"Point"]], layout:{
        "text-field":["coalesce",["get","name_en"],["get","name"]], "text-font":fontStack,
        "text-size":["interpolate",["linear"],["zoom"],8,10,14,13], "text-max-width":8,
        "text-letter-spacing":0.05 },
      paint:{ "text-color":"#2a5b7a", "text-halo-color":"#ffffff", "text-halo-width":1.3 } });
  }
}
const $ = id => document.getElementById(id);
const status = (msg,warn) => { $("status").innerHTML = msg ? `<div class="note">${msg}</div>` : ""; };

const HINT = "Click anywhere on the map for a windgram — generated in your browser from the forecast cube.";

// ── Day picker — probe which dated cubes exist on R2 (today/tomorrow), ───────
// anchored to the forecast zone (PDT) like v1, skipping a spent day past 8pm.
function dayLabel(off, ds){
  if(off===0) return "Today";
  if(off===1) return "Tomorrow";
  return new Date(ds+"T12:00:00Z").toLocaleDateString(undefined, {weekday:"short"});
}
async function discoverDays(m){
  if(daysCache[m]) return daysCache[m];
  const [by,bm,bd] = new Date().toLocaleDateString("en-CA",{timeZone:"America/Los_Angeles"}).split("-").map(Number);
  const out=[];
  for(let off=0; off<=2; off++){
    const d=new Date(Date.UTC(by,bm-1,bd+off));
    const ds=d.toISOString().slice(0,10);
    if(Date.now() > Date.parse(ds+"T20:00:00-07:00")) continue;   // skip a day once its soaring window is spent
    let ok=false;
    try{ let r=await fetch(cubeUrl(m,ds)+"/zarr.json",{method:"HEAD"}); if(r.status===405) r=await fetch(cubeUrl(m,ds)+"/zarr.json"); ok=r.ok; }catch(e){}
    if(ok) out.push({ date:ds, off, label:dayLabel(off,ds), sub:ds.slice(5) });
  }
  daysCache[m]=out;
  return out;
}
function renderDays(days){
  const el=$("days"); el.innerHTML="";
  el.classList.toggle("single", days.length<2);   // hide the picker when there's only one day
  days.forEach(d=>{
    const b=document.createElement("button");
    b.innerHTML=`${d.label}<span class="sub">${d.sub}</span>`;
    b.classList.toggle("active", d.date===currentDate);
    b.onclick=()=>{ if(d.date!==currentDate) loadModel(model, d.date); };
    el.appendChild(b);
  });
}

async function loadModel(m, date){
  model = m; $("wgwrap").style.display="none"; $("hint").style.display="none";
  status("Loading "+m.toUpperCase()+" cube…");
  // Resolve which forecast day to load + render the day picker.
  const days = await discoverDays(m);
  if(!date || !days.find(d=>d.date===date)) date = days.length ? days[0].date : "latest";
  currentDate = date;
  renderDays(days);
  try {
    const store = new zarr.FetchStore(cubeUrl(m, currentDate));
    const root = zarr.root(store);
    const open = n => zarr.open(root.resolve(n), {kind:"array"});
    cube = { store, root, open,
      lat: await zarr.get(await open("lat")), lon: await zarr.get(await open("lon")),
      hours:(await zarr.get(await open("time"))).data, pres:(await zarr.get(await open("level"))).data,
      cacheA:{} };
    cube.Y = cube.lat.shape[0]; cube.X = cube.lat.shape[1];
    cube.T = cube.hours.length; cube.L = cube.pres.length;
    // Native LCC extent + CRS for the map overlay. The CRS travels with the cube
    // as a CF grid_mapping (crs_wkt); hand it straight to zarr-layer along with
    // edge bounds and which dims are spatial. Per-cube so NAM/HRRR each project
    // correctly. (zarr-layer ≥0.5.1 handles the spherical-earth WKT correctly.)
    try {
      const gm = (await (await fetch(cubeUrl(m, currentDate)+"/spatial_ref/zarr.json")).json()).attributes;
      cube.crs = gm.crs_wkt;
      const xa=(await zarr.get(await open("x"))).data, ya=(await zarr.get(await open("y"))).data;
      const xs=xa[1]-xa[0], ys=ya[1]-ya[0];
      cube.bounds=[ xa[0]-xs/2, Math.min(ya[0],ya[ya.length-1])-Math.abs(ys)/2,
                    xa[xa.length-1]+xs/2, Math.max(ya[0],ya[ya.length-1])+Math.abs(ys)/2 ];
    } catch(e){ console.warn("[overlay] projection metadata unavailable:", e); }
    // Local-time labels for the slider: the cube's time axis is UTC hour-of-day
    // on its soaring date (wrapping past midnight); render each in the viewer's
    // local zone (machine TZ — for PNW users that's PDT, the forecast zone).
    try {
      const rootAttrs = (await (await fetch(cubeUrl(m, currentDate)+"/zarr.json")).json()).attributes || {};
      const d0 = rootAttrs.date;
      cube.date = d0; cube.dxKm = rootAttrs.dx_km;   // for the windgram title (date + grid resolution)
      if (d0) {
        const [Y,M,D] = d0.split("-").map(Number);
        let dayOff=0, prev=-1;
        cube.localTimes = Array.from(cube.hours).map(h=>{
          h=h|0; if(prev>=0 && h<prev) dayOff++; prev=h;
          return new Date(Date.UTC(Y,M-1,D+dayOff,h))
            .toLocaleTimeString([], {hour:"numeric", timeZoneName:"short"});
        });
      }
    } catch(e){ /* fall back to UTC labels */ }
    setupTime(); await setOverlay(tIdx); await refreshHoverSlice(); status("");
    $("legend").style.display = "";                              // TOL scale for the overlay
    $("hint").textContent = HINT; $("hint").style.display = "";   // cube ready → invite a click
    goodModel = m;                                               // remember the last model that loaded
    setModelMeta(m);                                             // refresh the toggle sublabel (resolution · date)
    showWindgram(lastSite.lng, lastSite.lat, lastSite.name);     // default windgram (Poo Poo Point on first load)
  } catch(e){
    // No warning box — just log and snap the toggle back to the model that's
    // currently up (the failed model's cube isn't published yet).
    console.warn(`[cube] ${m.toUpperCase()} unavailable:`, e);
    status("");
    model = goodModel;
    const r = document.querySelector(`input[name="model"][value="${goodModel}"]`);
    if(r) r.checked = true;
    if(!cube){ $("hint").style.display = "none"; }   // nothing loaded at all (initial-load failure)
  }
}

function timeLabel(ti){
  return cube.localTimes ? cube.localTimes[ti] : `${String(cube.hours[ti]|0).padStart(2,"0")}:00 UTC`;
}
function setupTime(){
  const s=$("tslider"); s.max=cube.T-1; s.value=tIdx=Math.min(tIdx,cube.T-1);
  $("tlabel").textContent = timeLabel(tIdx);
  // Drive time in place via setSelector — recreating the layer per tick races
  // and tears the overlay off the map. Build it once in setOverlay().
  s.oninput=()=>{
    tIdx=+s.value; $("tlabel").textContent = timeLabel(tIdx);
    if(zlayer) zlayer.setSelector({ time:{ selected: tIdx, type:"index" } });
    refreshHoverSlice();
  };
}

async function setOverlay(ti){
  $("tlabel").textContent = timeLabel(ti);
  try {
    const { ZarrLayer } = await import("https://esm.sh/@carbonplan/zarr-layer");
    if(zlayer && map.getLayer("tol")) map.removeLayer("tol");
    zlayer = new ZarrLayer({ id:"tol", source:cubeUrl(model), variable:"tol_ft",
      zarrVersion:3, proj4:cube.crs, bounds:cube.bounds, spatialDimensions:{lat:"y",lon:"x"},
      selector:{ time: { selected: ti, type:"index" } },   // ti is an index, not a UTC-hour value
      clim:TOL_CLIM, colormap:TOL_CMAP, opacity:0.6 });
    // Add unconditionally — setOverlay only runs after the style is loaded, and
    // map.loaded() can read false while the DEM tiles are still streaming, which
    // would wrongly defer this to a one-shot 'load' that already fired.
    map.addLayer(zlayer, map.getLayer(beforeLabelId) ? beforeLabelId : undefined);
  } catch(e){ console.error("[overlay] failed:", e); }
}

function buildLegend(){
  $("legendBar").style.background = `linear-gradient(to top, ${TOL_CMAP.join(",")})`;
  const [lo,hi]=TOL_CLIM;
  $("legendTicks").innerHTML = [10000,8000,6000,4000,2000].map(v=>
    `<span style="top:${(100*(1-(v-lo)/(hi-lo))).toFixed(1)}%">${v/1000}k ft</span>`).join("");
}

const acc = v => (...ix) => v.data[ix.reduce((s,k,i)=>s+k*v.stride[i],0)];
function nearest(lng,la){
  const lat=acc(cube.lat), lon=acc(cube.lon); let best=1e9,by=0,bx=0;
  for(let j=0;j<cube.Y;j++)for(let i=0;i<cube.X;i++){
    const d=(lat(j,i)-la)**2+(lon(j,i)-lng)**2; if(d<best){best=d;by=j;bx=i;} }
  return [by,bx,lat(by,bx),lon(by,bx)];
}

// Top-of-lift hover readout — cache the current time's TOL slice in JS so a
// mousemove is a fast in-memory lookup, not a fetch.
let hoverTol = null;
async function refreshHoverSlice(){
  hoverTol = null;
  try {
    cube.tolCache = cube.tolCache || {};
    if(!cube.tolCache[tIdx]) cube.tolCache[tIdx] = acc(await zarr.get(await cube.open("tol_ft"),[tIdx,null,null]));
    hoverTol = cube.tolCache[tIdx];
  } catch(e){ /* hover unavailable */ }
}
map.on("mousemove", e=>{
  const el=$("tolhover");
  if(!cube || !hoverTol){ el.style.display="none"; return; }
  const [yi,xi,la,lo]=nearest(e.lngLat.lng,e.lngLat.lat);
  if(Math.abs(la-e.lngLat.lat)>0.02 || Math.abs(lo-e.lngLat.lng)>0.02){ el.style.display="none"; return; }   // outside the cube
  const v=hoverTol(yi,xi);
  el.style.left=e.point.x+"px"; el.style.top=e.point.y+"px"; el.style.display="block";
  el.textContent = isFinite(v) ? `${Math.round(v).toLocaleString()} ft` : "—";
});
map.on("mouseout", ()=>{ $("tolhover").style.display="none"; });
// Pull a single grid column out of the cube and materialise it into the plain
// [time][level] / [time] arrays the windgram library expects (WindgramData).
async function column(yi,xi){
  const g3=async n=>{ const v=await zarr.get(await cube.open(n),[null,null,yi,xi]);   // (T,L)
    const a=[]; for(let t=0;t<cube.T;t++){ const r=[]; for(let k=0;k<cube.L;k++) r.push(v.data[t*v.stride[0]+k*v.stride[1]]); a.push(r); } return a; };
  const s2=async n=>{ const v=await zarr.get(await cube.open(n),[null,yi,xi]);          // (T,)
    const a=[]; for(let t=0;t<cube.T;t++) a.push(v.data[t*v.stride[0]]); return a; };
  // All-integer selection returns a bare scalar (no .data) in zarrita — read it directly.
  const t0=async n=>{ const v=await zarr.get(await cube.open(n),[yi,xi]); return typeof v==="number"?v:v.data[0]; };
  return {
    hoursUtc: Array.from(cube.hours).map(h=>h|0),
    terrainFt: await t0("terrain_ft"),
    ghFt: await g3("gh_ft"), tc: await g3("tc"), td: await g3("td"), rh: await g3("rh"),
    uKt: await g3("u_kt"), vKt: await g3("v_kt"),
    pblhM: await s2("pblh_m"), hfx: await s2("hfx"), lh: await s2("lh"),
    t2K: await s2("t2_k"), sfcpMb: await s2("sfcp_mb"),
  };
}

// The site shown on initial load and re-rendered when the model is switched.
let lastSite = { lng:-122.00819, lat:47.49927, name:"Poo Poo Point" };

async function showWindgram(lng, lat, name){
  if(!cube) return;
  lastSite = { lng, lat, name };
  const [yi,xi,la,lo]=nearest(lng,lat);
  $("hint").textContent="loading column…"; $("hint").style.display="";
  try {
    const data = await column(yi,xi);
    $("wgwrap").style.display=""; $("hint").style.display="none";
    $("site-name").textContent = name || `${la.toFixed(3)}, ${lo.toFixed(3)}`;
    $("coords").textContent = `${la.toFixed(3)}, ${lo.toFixed(3)} · terrain ${Math.round(data.terrainFt)} ft`;
    renderWindgram($("wg"), data);
  } catch(err){ $("hint").textContent="column unavailable: "+(err&&err.message||err); }
}

// Toggle-button helpers ───────────────────────────────────────────────────
// Resolution + run date in each button's sublabel (the v1 style).
function setModelMeta(m){
  const el = document.querySelector(`.res[data-model="${m}"]`);
  if(!el || !cube) return;
  const res = cube.dxKm ? (cube.dxKm>=1?`${cube.dxKm.toFixed(1)} km`:`${Math.round(cube.dxKm*1000)} m`) : el.dataset.res;
  el.textContent = cube.date ? `${res} · ${cube.date}` : res;
}
// Gracefully disable a model's button when its cube isn't published.
function setModelAvailable(m, ok){
  const input = document.querySelector(`input[name="model"][value="${m}"]`);
  const label = input && input.closest("label");
  if(!input || !label) return;
  input.disabled = !ok;
  label.classList.toggle("disabled", !ok);
  if(!ok){ const el=document.querySelector(`.res[data-model="${m}"]`); if(el) el.textContent="unavailable"; }
}
async function probeModel(m){
  try{
    let r = await fetch(cubeUrl(m)+"/zarr.json", {method:"HEAD"});
    if(r.status===405) r = await fetch(cubeUrl(m)+"/zarr.json");   // some R2 setups reject HEAD
    return r.ok;
  }catch(e){ return false; }
}

// ── Launch / landing site markers (./sites.json) — click to drop a windgram ──
const SITE_GLYPH = {
  // paraglider canopy + lines = launch
  launch:`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13c3-5 15-5 18 0"/><path d="M7 13l5 5 5-5"/></svg>`,
  // target = landing zone
  landing:`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.4" fill="#fff" stroke="none"/></svg>`,
};
async function loadSites(){
  let sites;
  try { sites = await (await fetch("./sites.json",{cache:"no-cache"})).json(); }
  catch(e){ console.warn("[sites] list unavailable:", e); return; }
  for(const s of sites){
    const el=document.createElement("div");
    el.className="ll-marker "+(s.type==="landing"?"landing":"launch");
    el.innerHTML=`<span class="ll-ico">${SITE_GLYPH[s.type]||SITE_GLYPH.launch}</span><span class="ll-name">${s.name}</span>`;
    el.title=`${s.name} (${s.type})`;
    el.addEventListener("click", ev=>{ ev.stopPropagation(); showWindgram(s.lon, s.lat, s.name); });
    new maplibregl.Marker({element:el, anchor:"bottom"}).setLngLat([s.lon,s.lat]).addTo(map);
  }
}

map.on("click", e=> showWindgram(e.lngLat.lng, e.lngLat.lat));
document.querySelectorAll('input[name="model"]').forEach(r=>r.addEventListener("change",e=>{ if(!e.target.disabled) loadModel(e.target.value); }));
map.on("load", ()=>{
  setupBasemap(); buildLegend(); loadSites(); loadModel("nam");
  probeModel("hrrr").then(ok=> setModelAvailable("hrrr", ok));   // dim HRRR if its cube isn't published yet
});
</script>
</body>
